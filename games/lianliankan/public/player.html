<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#fff5fb"><title>可愛連連看</title><link rel="stylesheet" href="/games/lianliankan/style.css"><link rel="stylesheet" href="/games/lianliankan/player.css"><link rel="stylesheet" href="/common-leaderboard.css"><link rel="stylesheet" href="/common-prizes.css"></head><body>
<main class="page"><section class="player-hero card"><div><div class="eyebrow">✨ 小遊戲館</div><h1>🔗 可愛連連看</h1><p>相同圖案，最多 2 次轉彎可以連到就消除。</p></div><div class="stats"><div class="stat"><span id="timeLabel">剩餘時間</span><b id="time">00:00</b></div><div class="stat"><span>剩餘圖案</span><b id="remain">0</b></div><div class="stat"><span>剩餘洗牌</span><b id="shuffleRemain">0</b></div></div></section>
<section id="entryCard" class="card entry-card"><h2 class="section-title">開始遊戲</h2><label class="field"><span>玩家名稱</span><input id="playerName" maxlength="24" placeholder="輸入你的名稱"></label><div id="settingSummary" class="status" style="margin-top:12px"></div><div id="choiceBox" class="grid form-grid hidden" style="margin-top:10px"><label class="field"><span>圖案系列</span><select id="playerTheme"></select></label><label class="field"><span>難度</span><select id="playerDifficulty"></select></label></div><button id="startBtn" class="btn primary" style="width:100%;margin-top:12px">🎮 開始遊戲</button><div id="entryMsg" class="status hidden" style="margin-top:10px"></div></section>
<section id="gameCard" class="card game-card hidden"><div id="message" class="game-message">開始找相同圖案吧！</div><div id="boardWrap" class="board-wrap"><svg id="lineLayer" class="line-layer" aria-hidden="true"></svg><div id="board" class="board"></div></div><div class="actions"><button id="shuffleBtn" class="btn warn">🔀 洗牌</button></div></section>
<section class="card note" style="margin-top:14px"><b>規則：</b>直線、1 次轉彎、2 次轉彎都可以，外圍也能繞。<br>如果盤面完全沒有任何可連組合，系統會自動洗牌，而且不扣玩家手動洗牌次數。</section>
<section id="hallLeaderboard" class="hall-leaderboard" data-game="lianliankan"></section></main>
<div id="finishModal" class="modal hidden"><div class="modal-card"><div class="big">🎉</div><h2>完成！</h2><p id="finishText">實際完成時間：00:00</p><div id="finishPrize" class="status"></div><button id="finishHall" class="btn primary">🏠 返回遊戲廳</button></div></div>
<div id="timeoutModal" class="modal hidden"><div class="modal-card"><div class="big">⏰</div><h2>時間到！</h2><p>這一局還沒有全部消除。</p><button id="timeoutAgain" class="btn primary">🔄 重新開始</button><button id="timeoutHall" class="btn">🏠 返回遊戲廳</button></div></div>
<script src="/common-prizes.js"></script><script src="/games/lianliankan/player.js"></script><script src="/common-leaderboard.js"></script></body></html>
