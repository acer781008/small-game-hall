<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>連連看設定</title><link rel="stylesheet" href="/games/lianliankan/style.css"><style>body{background:#fff;padding:14px}.page{max-width:760px;margin:0}.card{box-shadow:none;border:1px solid #eadfe7}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.note{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f3f8ff;color:#685f75;font-weight:750}.checks{display:flex;gap:8px;flex-wrap:wrap}.chip{display:flex;gap:6px;align-items:center;padding:8px 10px;border:1px solid #e5ddea;border-radius:11px;background:#faf8fd;font-weight:800;white-space:nowrap}.chip input[type="checkbox"],.field input[type="checkbox"]{width:auto!important;min-width:auto!important;flex:0 0 auto;margin:0}.chip select{flex:0 0 auto}.tier{width:auto!important;padding:6px!important;margin-left:4px}.full{grid-column:1/-1}@media(max-width:620px){.form-grid{grid-template-columns:1fr}}</style></head><body><main class="page"><section class="card"><h2 class="section-title">🔗 連連看設定</h2><p class="sub">主控決定可開放的主題／難度；遊戲時間仍由主控統一設定。</p><div class="grid form-grid">
<label class="field full"><span><input id="selfSelect" type="checkbox"> 允許玩家自選</span><small>開啟後，玩家只看到主控勾選的選項。</small></label>
<label class="field"><span>主控指定圖案系列</span><select id="theme"><option value="fruit">🍎 水果系列</option><option value="pet">🐶 寵物系列</option><option value="dessert">🧁 甜點系列</option><option value="mixed">🌈 混合系列</option></select></label>
<label class="field"><span>主控指定難度</span><select id="difficulty"><option value="easy">⭐ 簡單｜4×6</option><option value="normal">⭐⭐ 普通｜6×8</option><option value="hard">⭐⭐⭐ 困難｜8×9</option></select></label>
<div class="field full"><span>玩家可看到的圖案系列</span><div class="checks" id="themeChecks"></div></div>
<div class="field full"><span>玩家可看到的難度＋C 級別</span><div class="checks" id="difficultyChecks"></div></div>
<label class="field"><span>玩家可手動洗牌</span><select id="shuffleLimit"><option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option></select></label>
<label class="field"><span>遊戲時間</span><select id="timeMinutes"><option value="3">3 分鐘</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option><option value="0">不限時間</option></select></label>
</div><div class="note">⏱️ 有限時顯示「剩餘時間」；不限時間從 00:00 往上計時。C 模式預設：簡單 C1、普通 C2、困難 C3。</div><div class="actions"><button id="saveBtn" class="btn primary">💾 儲存設定</button></div><div id="saveMsg" class="status hidden"></div></section></main><script>
const $=id=>document.getElementById(id),themes=[['fruit','🍎 水果'],['pet','🐶 寵物'],['dessert','🧁 甜點'],['mixed','🌈 混合']],diffs=[['easy','簡單'],['normal','普通'],['hard','困難']];let loaded;
async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}
function draw(s){themeChecks.innerHTML=themes.map(([v,n])=>`<label class="chip"><input class="atheme" type="checkbox" value="${v}" ${(s.allowedThemes||[]).includes(v)?'checked':''}> ${n}</label>`).join('');difficultyChecks.innerHTML=diffs.map(([v,n])=>`<label class="chip"><input class="adiff" type="checkbox" value="${v}" ${(s.allowedDifficulties||[]).includes(v)?'checked':''}> ${n}<select class="tier" data-tier="${v}"><option>C1</option><option>C2</option><option>C3</option></select></label>`).join('');diffs.forEach(([v])=>document.querySelector(`[data-tier="${v}"]`).value=s.tierByDifficulty?.[v]||({easy:'C1',normal:'C2',hard:'C3'})[v])}
async function load(){const d=await api('/api/game-settings/lianliankan'),s=d.settings;loaded=s;selfSelect.checked=!!s.selfSelect;theme.value=s.theme;difficulty.value=s.difficulty;shuffleLimit.value=String(s.shuffleLimit);timeMinutes.value=String(s.timeMinutes);if(![...timeMinutes.options].some(o=>o.value===String(s.timeMinutes)))timeMinutes.value='5';draw(s)}
saveBtn.onclick=async()=>{try{const allowedThemes=[...document.querySelectorAll('.atheme:checked')].map(x=>x.value),allowedDifficulties=[...document.querySelectorAll('.adiff:checked')].map(x=>x.value);if(!allowedThemes.length||!allowedDifficulties.length)return alert('主題與難度至少各開放一項');const tierByDifficulty={};document.querySelectorAll('[data-tier]').forEach(x=>tierByDifficulty[x.dataset.tier]=x.value);await api('/api/game-settings/lianliankan',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({selfSelect:selfSelect.checked,theme:theme.value,difficulty:difficulty.value,allowedThemes,allowedDifficulties,tierByDifficulty,shuffleLimit:+shuffleLimit.value,timeMinutes:+timeMinutes.value})});saveMsg.textContent='✅ 已儲存';saveMsg.classList.remove('hidden')}catch(e){saveMsg.textContent='❌ '+e.message;saveMsg.classList.remove('hidden')}};load();
</script></body></html>
