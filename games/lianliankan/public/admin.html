<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>連連看設定</title><link rel="stylesheet" href="/games/lianliankan/style.css"><style>body{background:#fff;padding:14px}.page{max-width:760px;margin:0}.card{box-shadow:none;border:1px solid #eadfe7}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.note{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f3f8ff;color:#685f75;font-weight:750}@media(max-width:620px){.form-grid{grid-template-columns:1fr}}</style></head><body><main class="page"><section class="card"><h2 class="section-title">🔗 連連看設定</h2><p class="sub">活動碼、每位玩家可完成次數、獎品與紀錄由小遊戲館統一管理。</p><div class="grid form-grid">
<label class="field"><span>圖案系列</span><select id="theme"><option value="fruit">🍎 水果系列</option><option value="pet">🐶 寵物系列</option><option value="dessert">🧁 甜點系列</option><option value="mixed">🌈 混合系列</option></select></label>
<label class="field"><span>難度</span><select id="difficulty"><option value="easy">⭐ 簡單｜4×6・24 格</option><option value="normal">⭐⭐ 普通｜6×8・48 格</option><option value="hard">⭐⭐⭐ 困難｜8×9・72 格</option></select></label>
<label class="field"><span>玩家可手動洗牌</span><select id="shuffleLimit"><option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option></select></label>
<label class="field"><span>遊戲時間</span><select id="timeMinutes"><option value="1">1 分鐘</option><option value="1.5">1.5 分鐘</option><option value="2">2 分鐘</option><option value="3">3 分鐘</option><option value="5">5 分鐘</option><option value="0">不限時間</option></select></label>
</div><div class="note">⏱️ 有限時顯示「剩餘時間」倒數；不限時間從 00:00 往上計時。無解自動洗牌不扣手動洗牌次數。</div><div class="actions"><button id="saveBtn" class="btn primary">💾 儲存設定</button></div><div id="saveMsg" class="status hidden"></div></section></main><script>
const $=id=>document.getElementById(id);async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}async function load(){const d=await api('/api/game-settings/lianliankan'),s=d.settings;$('theme').value=s.theme;$('difficulty').value=s.difficulty;$('shuffleLimit').value=String(s.shuffleLimit);$('timeMinutes').value=String(s.timeMinutes);if(![...$('timeMinutes').options].some(o=>o.value==String(s.timeMinutes)))$('timeMinutes').value='2'}$('saveBtn').onclick=async()=>{try{await api('/api/game-settings/lianliankan',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({theme:$('theme').value,difficulty:$('difficulty').value,shuffleLimit:+$('shuffleLimit').value,timeMinutes:+$('timeMinutes').value})});$('saveMsg').textContent='✅ 已儲存';$('saveMsg').classList.remove('hidden')}catch(e){$('saveMsg').textContent='❌ '+e.message;$('saveMsg').classList.remove('hidden')}};load();
</script></body></html>
