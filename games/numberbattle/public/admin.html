<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數字大亂鬥設定</title><link rel="stylesheet" href="/games/numberbattle/style.css"><style>
body{background:#fff;padding:14px}.page{max-width:820px;margin:0}.card{box-shadow:none}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.checks{display:flex;gap:8px;flex-wrap:wrap}.chip{display:flex;gap:7px;align-items:center;padding:9px 11px;border:1px solid #e2d7e9;border-radius:12px;background:#faf7fd;font-weight:850}.chip input{width:auto}.chip select{width:auto;padding:6px}.toggle-row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:15px;background:linear-gradient(135deg,#f3edff,#fff2f8);border:1px solid #e4d8f0;font-weight:950}.toggle-row input{width:auto!important;height:auto;min-width:auto!important;margin:0;accent-color:#8157d8}.chip input[type="checkbox"]{width:auto!important;min-width:auto!important;margin:0;flex:0 0 auto}.note{padding:11px 13px;border-radius:14px;background:#f6f1ff;color:#6c5b7b;font-weight:800;line-height:1.55}.actions{margin-top:14px}.subhead{font-weight:1000;color:#68527c;margin:3px 0 7px}.host-only.dimmed{opacity:.48;filter:saturate(.7)}@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="page"><section class="card"><h2>🔢 數字大亂鬥設定</h2><p>主控決定可開放的玩法／難度；遊戲時間與每題秒數仍由主控統一設定。</p><div class="grid">
<label class="toggle-row full"><input id="selfSelect" type="checkbox"> <span>允許玩家自選</span></label>
<div class="field full"><span>開放玩法</span><div class="checks" id="modeChecks"></div></div>
<div class="field full"><span>開放難度＋C 級別</span><div class="checks" id="difficultyChecks"></div></div>
<label class="field host-only"><span>主控指定玩法</span><select id="mode"><option value="sum">🎯 湊數</option><option value="rush">⚡ 連續挑戰</option></select></label>
<label class="field host-only"><span>主控指定難度</span><select id="difficulty"><option value="easy">⭐ 簡單｜5×6｜5 題</option><option value="normal">🔥 普通｜6×6｜8 題</option><option value="hard">💀 困難｜7×7｜10 題</option></select></label>
<label class="field"><span>每題作答時間</span><select id="questionSeconds"><option value="0">不限制</option><option value="5">5 秒</option><option value="6">6 秒</option><option value="8">8 秒</option><option value="10">10 秒</option><option value="12">12 秒</option><option value="15">15 秒</option></select></label>
<label class="field"><span>整局遊戲時間</span><select id="timeMinutes"><option value="1">1 分鐘</option><option value="2">2 分鐘</option><option value="3">3 分鐘</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option><option value="0">不限時間</option></select></label>
</div><div class="note">🎯 湊數：一題一題找出剛好等於目標的組合。<br>⚡ 連續挑戰：答對後幾乎不停頓，立即接下一個目標，連續考驗心算與反應。<br>開啟「允許玩家自選」後，玩家只會看到主控勾選開放的玩法與難度。</div><div class="actions"><button id="saveBtn" class="primary">💾 儲存設定</button></div><div id="saveMsg" class="status hidden"></div></section></main><script>
const $=id=>document.getElementById(id),diffs=[['easy','⭐ 簡單｜5×6'],['normal','🔥 普通｜6×6'],['hard','💀 困難｜7×7']],modes=[['sum','🎯 湊數'],['rush','⚡ 連續挑戰']];
async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}
function draw(s){
  $('modeChecks').innerHTML=modes.map(([v,n])=>`<label class="chip"><input class="amode" type="checkbox" value="${v}" ${(s.allowedModes||[]).includes(v)?'checked':''}> ${n}</label>`).join('');
  $('difficultyChecks').innerHTML=diffs.map(([v,n])=>`<label class="chip"><input class="adiff" type="checkbox" value="${v}" ${(s.allowedDifficulties||[]).includes(v)?'checked':''}> ${n}<select data-tier="${v}"><option>C1</option><option>C2</option><option>C3</option></select></label>`).join('');
  diffs.forEach(([v])=>document.querySelector(`[data-tier="${v}"]`).value=s.tierByDifficulty?.[v]||({easy:'C1',normal:'C2',hard:'C3'})[v]);
}
function syncSelfSelect(){document.querySelectorAll('.host-only').forEach(x=>x.classList.toggle('dimmed',$('selfSelect').checked));}
async function load(){const d=await api('/api/game-settings/numberbattle'),s=d.settings;$('selfSelect').checked=!!s.selfSelect;$('mode').value=s.mode||'sum';$('difficulty').value=s.difficulty;$('questionSeconds').value=String(s.questionSeconds);$('timeMinutes').value=String(s.timeMinutes);draw(s);syncSelfSelect()}
$('selfSelect').onchange=syncSelfSelect;
$('saveBtn').onclick=async()=>{try{const allowedModes=[...document.querySelectorAll('.amode:checked')].map(x=>x.value),allowedDifficulties=[...document.querySelectorAll('.adiff:checked')].map(x=>x.value);if(!allowedModes.length)return alert('至少開放一種玩法');if(!allowedDifficulties.length)return alert('至少開放一個難度');const tierByDifficulty={};document.querySelectorAll('[data-tier]').forEach(x=>tierByDifficulty[x.dataset.tier]=x.value);await api('/api/game-settings/numberbattle',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({selfSelect:$('selfSelect').checked,mode:$('mode').value,allowedModes,difficulty:$('difficulty').value,allowedDifficulties,tierByDifficulty,questionSeconds:+$('questionSeconds').value,timeMinutes:+$('timeMinutes').value})});$('saveMsg').textContent='✅ 已儲存';$('saveMsg').classList.remove('hidden')}catch(e){$('saveMsg').textContent='❌ '+e.message;$('saveMsg').classList.remove('hidden')}};load();
</script></body></html>
