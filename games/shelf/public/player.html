<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>貨架整理小遊戲</title><link rel="stylesheet" href="/common-leaderboard.css"><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior-y:none}body{margin:0;font-family:"Microsoft JhengHei",system-ui;background:linear-gradient(#c8f0ff 0 24%,#f4f7db 24% 100%);color:#4b301d}.app{width:min(100%,760px);margin:auto;padding:8px}.card{background:linear-gradient(#fff9e8,#ffedc4);border:3px solid #673a1b;border-radius:18px;padding:9px 11px;box-shadow:0 6px #573017;margin-bottom:10px}.title{text-align:center;font-size:clamp(22px,5.2vw,31px);font-weight:1000;color:#c55b2b;text-shadow:2px 2px #fff}.room{text-align:center;font-weight:900;color:#71563f}.section{background:#fff;border:2px solid #d9b276;border-radius:13px;padding:10px;margin-top:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.playerField{min-width:0}.playerField input{font-size:18px;padding:14px 12px}.playedBox{min-width:112px;padding:7px 12px!important;margin-top:0!important}.playedBox .big{font-size:24px}label{font-size:13px;font-weight:900}input{width:100%;padding:10px;border:2px solid #d8b27a;border-radius:9px;font-weight:800}.themes,.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.levels{grid-template-columns:1fr 1fr}.pick{background:#fff;border:3px solid #d8b67f;border-radius:15px;padding:10px;color:#54351e;font-weight:1000;box-shadow:0 4px #b7894e;min-height:82px}.pick.active{outline:4px solid #ffd84e}.levels .pick{font-size:19px;line-height:1.35;min-height:106px;color:#2f2117;background:#fffaf0}.levels .pick small{display:block;margin-top:5px;font-size:15px;line-height:1.5;font-weight:900;color:#2f2117}.themeEmoji{font-size:33px;display:block;height:40px;line-height:40px}.themeImg{height:48px;display:grid;place-items:center}.themeImg img{width:52px;height:46px;object-fit:contain;display:block;margin:0 auto}.prod img{width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center bottom;border:0;border-radius:0;box-shadow:none;background:transparent;display:block}.start{width:100%;background:#e4772f;color:#fff;border:0;border-radius:12px;padding:13px;font-size:20px;font-weight:1000;box-shadow:0 4px #0003;margin-top:10px}.start:disabled{background:#aaa}.summary{text-align:center;font-weight:900}.big{font-size:28px;color:#bd572a;font-weight:1000}.cab{margin-top:10px;padding:7px;background:linear-gradient(90deg,#70401d,#c47b38 9%,#9c5827 91%,#613619);border:6px solid #573017;border-radius:19px;box-shadow:0 8px #4d2b16}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.shelf{height:100px;background:radial-gradient(circle at 50% 12%,#426f52,#20392c 76%);border:4px solid #d18a40;border-radius:7px;padding:5px 2px 14px;position:relative;overflow:hidden;box-shadow:inset 0 0 18px #0006}.shelf:after{content:"";position:absolute;left:0;right:0;bottom:0;height:11px;background:linear-gradient(#e09b4d,#a65f2a);border-top:2px solid #78431f}.items{height:74px;display:flex;align-items:end;justify-content:center}.item{width:33.33%;height:70px;display:flex;align-items:end;justify-content:center;touch-action:none;user-select:none;z-index:2;cursor:grab}.prod{width:100%;height:100%;display:grid;place-items:end center;pointer-events:none}.prod svg{width:96%;height:96%;overflow:visible;filter:drop-shadow(0 5px 3px #0006);pointer-events:none}.valid{outline:4px solid #ffe76b;outline-offset:-5px}.ghost{position:fixed;z-index:999;pointer-events:none;width:74px;height:74px;transform:translate(-50%,-55%)}.ghost .prod{width:100%;height:100%;display:grid;place-items:center}.ghost svg{width:100%;height:100%;filter:drop-shadow(0 7px 5px #0007)}.depth{position:absolute;right:2px;top:2px;background:#0009;color:#fff;border-radius:9px;padding:2px 5px;font-size:9px;font-weight:900}.hud{display:grid;grid-template-columns:1fr;gap:5px}.hud div{background:#fff;border:2px solid #d8b27a;border-radius:10px;padding:6px;text-align:center;font-weight:900}.hud b{display:block;font-size:20px;color:#b95027}.msg{background:#fff8e6;border:2px solid #d8ad71;border-radius:11px;padding:8px;text-align:center;font-weight:900;margin-top:7px}.rules{font-size:13px;line-height:1.55}.overlay{display:none;position:fixed;inset:0;background:#2a1d13cc;z-index:1200;align-items:center;justify-content:center;padding:18px}.dialog{width:min(94vw,430px);background:#fff5d7;border:5px solid #70401e;border-radius:20px;padding:18px;text-align:center}.dialog button{width:100%;background:#4a965b;color:#fff;border:0;border-radius:11px;padding:11px;font-weight:1000;margin-top:10px}.error{color:#b33;font-weight:900;text-align:center}.hide{display:none!important}#game{touch-action:pan-y;overscroll-behavior-y:contain}body.game-lock{overflow-y:auto;position:static;width:auto;left:auto;right:auto}#game{touch-action:pan-y;overscroll-behavior-y:contain;padding-bottom:calc(110px + env(safe-area-inset-bottom))}@media(max-width:480px){.levels{grid-template-columns:1fr}.levels .pick{font-size:18px;min-height:78px;padding:9px 12px}.levels .pick small{font-size:15px;line-height:1.45}.row{grid-template-columns:minmax(0,1fr) 92px}.playerField input{font-size:17px;padding:13px 10px}.playedBox{min-width:92px;padding:6px!important}.playedBox .big{font-size:22px}.cab{padding:3px;border-width:4px}.grid{grid-template-columns:repeat(2,1fr);gap:3px}.shelf{height:78px;border-width:3px;padding:3px 1px 12px}.items{height:58px}.item{height:56px}.prod img{width:100%;height:100%;max-width:100%;max-height:100%}.themes{grid-template-columns:repeat(3,1fr)}.pick{padding:7px;font-size:12px}.themeEmoji{font-size:28px}.msg{padding:6px;font-size:13px;margin-top:5px}.hud div{padding:5px}.hud b{font-size:22px}}
</style></head><body><div class="app"><div class="card"><div class="title">🧺 貨架整理小遊戲</div><div class="room">活動碼：<span id="roomText"></span></div></div>
<div id="lobby" class="card"><div class="row"><label class="playerField">玩家名稱<input id="playerName" maxlength="20" placeholder="請輸入玩家名稱"></label><div class="section summary playedBox">已玩局數<div class="big" id="played">0</div></div></div><h3>選擇商品主題</h3><div class="themes" id="themes"></div><div class="section summary" id="chosen">請選擇商品主題</div><button class="start" id="startBtn" disabled>▶ 玩家自己開始遊戲</button><div class="error" id="error"></div><div class="section rules"><b>📘 遊戲方式</b><br>拖動商品到另一個有空位的貨架；同一貨架湊滿 3 個相同商品就會消除。前排清空後，後排會立即補上。<br><br><b>完成條件：</b>把全部貨架清空即完成本局。有設定時間時會倒數；不限時間時會從 00:00 往上計時。</div></div>
<div id="game" class="hide"><div class="card"><div class="hud"><div><span id="timeLabel">剩餘時間</span><b id="time">00:00</b></div></div></div><div class="cab"><div class="grid" id="grid"></div></div><div class="msg" id="msg">按住商品拖到另一個貨架。</div></div><section id="hallLeaderboard" class="hall-leaderboard" data-game="shelf"></section></div>
<div class="overlay" id="resultOverlay"><div class="dialog"><h2 id="resultTitle"></h2><div id="resultBody"></div><button id="retryBtn" style="display:none">🔄 重新開始</button><button id="hallBtn">🏠 返回遊戲廳</button></div></div>
<script>
const qs=new URLSearchParams(location.search),room=qs.get('room')||'123456';roomText.textContent=room;const levelNames={normal:'⭐ 普通',hard:'🔥 困難',hell:'💀 地獄'};const themeMeta={farm:{name:'農場作物',emoji:'🌽'},candy:{name:'糖果屋',emoji:'🍭'}};
const THEME_IMAGES={farm:Array.from({length:18},(_,i)=>`assets/themes-v6/farm-${String(i+1).padStart(2,'0')}.png`),candy:Array.from({length:18},(_,i)=>`assets/themes-v6/candy-${String(i+1).padStart(2,'0')}.png`)};
const THEME_COVERS={farm:'assets/themes-v6/farm-01.png',candy:'assets/themes-v6/candy-01.png'};
let cfg=null,chosenTheme=null,chosenLevel=null,runId=null,S=[],H=[],sel=null,drag=null,endAt=0,timer=null,playing=false,currentRun=null,resumeChecked=false;
function art(i){const src=THEME_IMAGES[chosenTheme][i%THEME_IMAGES[chosenTheme].length];return `<span class="prod"><img src="${src}" alt="商品" draggable="false"></span>`}
function nameKey(){return `shelfMini:${room}:name`}function runKey(){return `shelfMini:${room}:run`}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizeCfg(j){j=j&&typeof j==='object'?j:{};j.themes=j.themes&&typeof j.themes==='object'?j.themes:{};j.levels=j.levels&&typeof j.levels==='object'?j.levels:{};return j}
function seeded(seed){let x=(Number(seed)||1)>>>0;return()=>{x=(Math.imul(x,1664525)+1013904223)>>>0;return x/4294967296}}
function mixSeed(a,seed){const rnd=seeded(seed);for(let i=a.length-1;i;i--){let j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function saveState(){if(!playing||!currentRun)return;try{localStorage.setItem(runKey(),JSON.stringify({runId,currentRun,S,H,chosenTheme,chosenLevel,endAt}))}catch{}}
function loadSavedState(id){try{const x=JSON.parse(localStorage.getItem(runKey())||'null');return x&&String(x.runId)===String(id)&&Array.isArray(x.S)&&Array.isArray(x.H)?x:null}catch{return null}}
function clearState(){try{localStorage.removeItem(runKey())}catch{}}
async function load(){try{const r=await fetch('/games/shelf/api/room/'+room);const j=await r.json();if(!r.ok)throw new Error(j.error||'活動不存在');cfg=normalizeCfg(j);document.title=cfg.title||'貨架整理小遊戲';renderChoices();const savedName=localStorage.getItem(nameKey());if(savedName){playerName.value=savedName;await stats();if(!resumeChecked){resumeChecked=true;await tryResume(savedName)}}}catch(e){error.textContent=e.message;startBtn.disabled=true}}
function renderChoices(){themes.innerHTML='';chosenLevel=Object.keys(cfg.levels||{}).find(k=>cfg.levels[k]?.open&&levelNames[k])||chosenLevel||null;for(const [k,v] of Object.entries(cfg.themes||{})){if(!v||!themeMeta[k])continue;const b=document.createElement('button');b.className='pick';b.innerHTML=`<span class="themeImg"><img src="${THEME_COVERS[k]}" alt="${themeMeta[k].name}"></span>${themeMeta[k].name}`;b.onclick=()=>{if(playing)return;chosenTheme=k;renderChoices()};if(chosenTheme===k)b.classList.add('active');themes.appendChild(b)}updateChosen()}
function fmtMin(v){return Number(v)>0?`${Number(v)} 分鐘`:'不限時間'}
function updateChosen(){if(!chosenTheme){chosen.textContent='請選擇商品主題';startBtn.disabled=true;return}if(!chosenLevel||!cfg?.levels?.[chosenLevel]){chosen.textContent='主控尚未設定遊戲難度';startBtn.disabled=true;return}const s=cfg.levels[chosenLevel];chosen.innerHTML=`${themeMeta[chosenTheme].name}｜遊戲時間 ${fmtMin(s.min)}`;startBtn.disabled=false}
async function stats(){const n=playerName.value.trim();if(!n)return;try{localStorage.setItem(nameKey(),n);const r=await fetch(`/games/shelf/api/player/stats?room=${encodeURIComponent(room)}&player=${encodeURIComponent(n)}`);const j=await r.json();if(r.ok)played.textContent=j.played}catch{}}
async function tryResume(n){n=String(n||'').trim();if(!n||playing)return false;try{const r=await fetch(`/games/shelf/api/player/active?room=${encodeURIComponent(room)}&player=${encodeURIComponent(n)}`),j=await r.json();if(!r.ok)return false;if(j.activeRun){chosenTheme=j.activeRun.theme;chosenLevel=j.activeRun.level;renderChoices();startLocal(j.activeRun,true);return true}clearState()}catch{}return false}
playerName.addEventListener('change',async()=>{await stats();await tryResume(playerName.value)});playerName.addEventListener('blur',async()=>{await stats();await tryResume(playerName.value)});
startBtn.onclick=async()=>{error.textContent='';const name=playerName.value.trim();if(!name){error.textContent='請先輸入玩家名稱';return}localStorage.setItem(nameKey(),name);try{const r=await fetch('/games/shelf/api/player/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,player:name,theme:chosenTheme,level:chosenLevel})});const j=await r.json();if(!r.ok)throw new Error(j.error||'無法開始');startLocal(j,!!j.resumed)}catch(e){error.textContent=e.message}}
function buildInitial(seed){const requestedTypes={normal:12,hard:15,hell:18}[chosenLevel],types=Math.min(requestedTypes,THEME_IMAGES[chosenTheme].length),n={normal:12,hard:14,hell:15}[chosenLevel],front={normal:10,hard:13,hell:14}[chosenLevel],rearGroups={normal:10,hard:17,hell:24}[chosenLevel];S=Array.from({length:n},()=>[]);H=Array.from({length:n},()=>[]);let d=[];for(let x=0;x<front+rearGroups;x++){let t=x%types;d.push(t,t,t)}mixSeed(d,seed);let p=0;for(let i=0;i<front;i++){S[i]=d.slice(p,p+3);p+=3}let h=0;while(p<d.length){H[h%front].push(...d.slice(p,p+3));p+=3;h++}}
function startLocal(info,resume){runId=info.runId;chosenTheme=info.theme||chosenTheme;chosenLevel=info.level||chosenLevel;currentRun={runId,startedAt:Number(info.startedAt)||Date.now(),durationMs:Math.max(0,Number(info.durationMs)||0),seed:Number(info.seed)||1,theme:chosenTheme,level:chosenLevel};lobby.classList.add('hide');game.classList.remove('hide');document.body.classList.add('game-lock');playing=true;const saved=resume?loadSavedState(runId):null;if(saved){S=saved.S;H=saved.H;chosenTheme=saved.chosenTheme||chosenTheme;chosenLevel=saved.chosenLevel||chosenLevel}else buildInitial(currentRun.seed);endAt=currentRun.durationMs>0?currentRun.startedAt+currentRun.durationMs:null;clearInterval(timer);timer=setInterval(tick,200);render();if(resume)msg.textContent='🔄 已恢復原本尚未完成的貨架';saveState();tick()}
function fmtClock(sec){sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function tick(){if(!playing)return;if(endAt){timeLabel.textContent='剩餘時間';const left=Math.max(0,Math.ceil((endAt-Date.now())/1000));time.textContent=fmtClock(left);if(left<=0)finish('time')}else{timeLabel.textContent='遊戲時間';time.textContent=fmtClock((Date.now()-currentRun.startedAt)/1000)}}
function render(){grid.innerHTML='';S.forEach((a,si)=>{let sh=document.createElement('div');sh.className='shelf';sh.dataset.s=si;let row=document.createElement('div');row.className='items';a.forEach((t,ii)=>{let x=document.createElement('div');x.className='item';x.innerHTML=art(t);x.dataset.s=si;x.dataset.i=ii;x.onpointerdown=down;row.appendChild(x)});sh.appendChild(row);if(H[si].length){let d=document.createElement('div');d.className='depth';d.textContent='後排 '+Math.ceil(H[si].length/3);sh.appendChild(d)}grid.appendChild(sh)})}
function down(e){if(!playing)return;e.preventDefault();let x=e.currentTarget;sel={s:+x.dataset.s,i:+x.dataset.i,t:S[+x.dataset.s][+x.dataset.i]};let g=document.createElement('div');g.className='ghost';g.innerHTML=art(sel.t);document.body.appendChild(g);drag=g;move(e);document.querySelectorAll('.shelf').forEach((x,i)=>{if(i!==sel.s&&S[i].length<3)x.classList.add('valid')});window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',up,{once:true})}
function move(e){if(drag){e.preventDefault();drag.style.left=e.clientX+'px';drag.style.top=e.clientY+'px'}}
function up(e){window.removeEventListener('pointermove',move);let t=document.elementFromPoint(e.clientX,e.clientY)?.closest('.shelf');document.querySelectorAll('.shelf').forEach(x=>x.classList.remove('valid'));drag?.remove();drag=null;if(!t||+t.dataset.s===sel.s||S[+t.dataset.s].length>=3){sel=null;render();return}let f=sel.s,to=+t.dataset.s,type=sel.t;S[f].splice(sel.i,1);S[to].push(type);sel=null;refill(f);if(S[to].length===3&&S[to].every(v=>v===type)){S[to]=[];msg.textContent='✨ 三個相同商品已消除！';refill(to)}saveState();render();if(boardClear()){msg.textContent='🎉 全部貨架整理完成！';finish('clear')}}
function refill(i){if(!S[i].length&&H[i].length)S[i]=H[i].splice(0,3)}function boardClear(){return S.every(a=>!a.length)&&H.every(a=>!a.length)}
async function finish(reason){if(!playing)return;playing=false;clearInterval(timer);document.body.classList.remove('game-lock');const cleared=reason==='clear';if(cleared)time.textContent='完成';let success=false;try{const r=await fetch('/games/shelf/api/player/finish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room,runId,cleared})});const result=await r.json();if(!r.ok)throw new Error(result.error||'回報失敗');success=true;resultTitle.textContent=cleared?'✅ 貨架整理完成！':'⏰ 時間到・本局結束';const prizeText=result.prize?(result.prize.status==='awarded'?`<br>🎉 恭喜獲得：${esc(result.prize.prizeName)}`:result.prize.status==='game_out_of_stock'?'<br>🎁 貨架整理目前的獎品已兌換完畢':result.prize.status==='out_of_stock'?'<br>🎁 獎品已全數發完':result.prize.status==='limit_reached'?'<br>🎁 已達可得獎次數上限':result.prize.status==='activity_closed'?'<br>🏁 活動已結束，本局不再發獎':result.prize.status==='storage_error'?'<br>⚠️ 獎品資料保存失敗，請洽主控':'') : '';resultBody.innerHTML=`${themeMeta[chosenTheme].name}｜${levelNames[chosenLevel]}<br>${result.cleared?`✅ 已清空全部貨架<br>⏱ 實際完成時間：${fmtClock(result.elapsedMs/1000)}`:'本局未完成，可以重新開始'}${prizeText}<br>本局結果已送出主控。`;retryBtn.style.display=result.cleared?'none':'';if(result.cleared)window.refreshHallLeaderboard?.();}catch(e){resultTitle.textContent='⚠️ 結果回報失敗';resultBody.textContent=e.message+'。重新整理後仍會回到這一局，可再次送出結果。';retryBtn.style.display='none';}if(success)clearState();resultOverlay.style.display='flex'}
retryBtn.onclick=()=>{resultOverlay.style.display='none';game.classList.add('hide');lobby.classList.remove('hide');currentRun=null;runId=null;clearState();stats().then(()=>startBtn.click())};hallBtn.onclick=()=>{location.href='/?activity='+encodeURIComponent(room)};document.addEventListener('touchmove',e=>{if(playing&&drag&&e.target.closest('#game'))e.preventDefault()},{passive:false});load();
</script><script src="/common-leaderboard.js"></script></body></html>
