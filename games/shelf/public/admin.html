<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貨架整理設定</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#493e48}h2{margin:0 0 6px}p{color:#7d7079;margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-weight:800;display:block}select,input{width:100%;margin-top:6px;border:1px solid #d9ccd5;border-radius:11px;padding:10px;font:inherit;font-size:16px}button{border:0;border-radius:12px;padding:11px 16px;background:#7659d7;color:#fff;font:inherit;font-weight:900;cursor:pointer}.save{margin-top:16px}.msg{font-weight:900;margin-left:8px}.checks{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.checks input{width:auto;margin:0}@media(max-width:620px){.form{grid-template-columns:1fr}}</style></head><body><h2>🛒 貨架整理設定</h2><p>房號與備註已由小遊戲館統一管理。</p><div class="form"><label>每位玩家可完成<select id="attempts"><option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option><option value="5">5 次</option><option value="unlimited">不限次數</option></select></label><label>本次難度<select id="difficulty"><option value="normal">普通</option><option value="hard">困難</option><option value="hell">地獄</option></select></label><label class="full">商品主題<div class="checks"><label><input type="checkbox" id="farm"> 農場作物</label><label><input type="checkbox" id="candy"> 糖果屋</label></div></label><label>普通時間（分鐘）<input id="normalMin" type="number" min="0.5" step="0.5"></label><label>困難時間（分鐘）<input id="hardMin" type="number" min="0.5" step="0.5"></label><label>地獄時間（分鐘）<input id="hellMin" type="number" min="0.5" step="0.5"></label></div><button class="save" id="save">💾 儲存貨架設定</button><span id="msg" class="msg"></span><script>
let raw;async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}async function load(){const d=await api('/api/game-settings/shelf'),s=d.settings;raw=s;attempts.value=String(s.attempts);farm.checked=!!s.themes.farm;candy.checked=!!s.themes.candy;difficulty.value=Object.keys(s.levels).find(k=>s.levels[k].open)||'normal';normalMin.value=s.levels.normal.min;hardMin.value=s.levels.hard.min;hellMin.value=s.levels.hell.min}save.onclick=async()=>{try{const sel=difficulty.value;await api('/api/game-settings/shelf',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({attempts:attempts.value,themes:{farm:farm.checked,candy:candy.checked},levels:{normal:{open:sel==='normal',min:+normalMin.value},hard:{open:sel==='hard',min:+hardMin.value},hell:{open:sel==='hell',min:+hellMin.value}}})});msg.textContent='✅ 已儲存'}catch(e){msg.textContent=e.message}};load();</script></body></html>
