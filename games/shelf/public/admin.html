<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貨架整理設定</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#493e48}h2{margin:0 0 6px}p{color:#7d7079;margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-weight:800;display:block}select,input{width:100%;margin-top:6px;border:1px solid #d9ccd5;border-radius:11px;padding:10px;font:inherit;font-size:16px}input[type=checkbox]{width:auto;margin:0}.box{border:1px solid #e8dfe5;border-radius:14px;padding:12px}.checks{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.chip{display:flex;align-items:center;gap:6px;background:#f7f3f6;border-radius:11px;padding:8px 10px}.tier{width:auto;margin:0;padding:5px 7px;font-size:14px}.hint{grid-column:1/-1;padding:10px 12px;border-radius:12px;background:#f2f8ff;color:#665d72;font-weight:750}button{border:0;border-radius:12px;padding:11px 16px;background:#7659d7;color:#fff;font:inherit;font-weight:900;cursor:pointer}.save{margin-top:16px}.msg{font-weight:900;margin-left:8px}@media(max-width:620px){.form{grid-template-columns:1fr}}</style></head><body><h2>🛒 貨架整理設定</h2><p>遊戲時間已改成一個共用設定；玩家不能自己選時間。</p><div class="form">
<label class="full chip"><input id="selfSelect" type="checkbox"> 允許玩家自選難度</label>
<label>主控指定主題<select id="defaultTheme"><option value="farm">農場作物</option><option value="candy">糖果屋</option></select></label><label>主控指定難度<select id="defaultLevel"><option value="normal">普通</option><option value="hard">困難</option><option value="hell">地獄</option></select></label>
<label>遊戲時間（分鐘）<select id="timeMinutes"><option value="0">不限時間</option><option>3</option><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option><option>45</option><option>60</option></select></label>
<div class="full box"><b>開放難度＋C獎級別</b><div class="checks" id="levelChecks"></div></div>
<div class="full box"><b>商品主題</b><div class="checks"><label class="chip"><input type="checkbox" id="farm"> 農場作物</label><label class="chip"><input type="checkbox" id="candy"> 糖果屋</label></div></div>
<div class="hint">⏱️ 有限時顯示「剩餘時間」；不限時從 00:00 往上計時；完成紀錄實際花費時間。</div></div><button class="save" id="save">💾 儲存貨架設定</button><span id="msg" class="msg"></span><script>
const names={normal:'普通',hard:'困難',hell:'地獄'};let s=null;async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}function draw(){levelChecks.innerHTML='';for(const k of ['normal','hard','hell']){const x=s.levels[k];const lab=document.createElement('label');lab.className='chip';lab.innerHTML=`<input type="checkbox" data-open="${k}" ${x.open?'checked':''}> ${names[k]} <select class="tier" data-tier="${k}"><option ${x.tier==='C1'?'selected':''}>C1</option><option ${x.tier==='C2'?'selected':''}>C2</option><option ${x.tier==='C3'?'selected':''}>C3</option></select>`;levelChecks.appendChild(lab)}}async function load(){const d=await api('/api/game-settings/shelf');s=d.settings;selfSelect.checked=!!s.selfSelect;defaultLevel.value=s.defaultLevel||'normal';defaultTheme.value=s.defaultTheme||'farm';timeMinutes.value=String(s.timeMinutes??10);farm.checked=!!s.themes.farm;candy.checked=!!s.themes.candy;draw()}save.onclick=async()=>{try{const levels={};document.querySelectorAll('[data-open]').forEach(x=>levels[x.dataset.open]={open:x.checked,tier:document.querySelector(`[data-tier="${x.dataset.open}"]`).value});await api('/api/game-settings/shelf',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({selfSelect:selfSelect.checked,defaultLevel:defaultLevel.value,defaultTheme:defaultTheme.value,timeMinutes:+timeMinutes.value,themes:{farm:farm.checked,candy:candy.checked},levels})});msg.textContent='✅ 已儲存';load()}catch(e){msg.textContent=e.message}};load();
</script></body></html>
