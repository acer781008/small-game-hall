<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>貨架整理小遊戲｜主控登入</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Microsoft JhengHei",system-ui;background:linear-gradient(160deg,#d8f5ff,#fff4d9 55%,#ecdfff);color:#4b301d}.card{width:min(92vw,420px);background:#fffaf0;border:4px solid #70401e;border-radius:24px;padding:24px;box-shadow:0 12px 30px #0002}.title{text-align:center;font-size:30px;font-weight:1000;color:#c65f2e}.sub{text-align:center;margin:8px 0 18px;color:#7a6555;font-weight:800}input{width:100%;padding:14px;border:2px solid #d6b57d;border-radius:12px;font-size:18px}button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:#7b55aa;color:#fff;font-size:18px;font-weight:1000;box-shadow:0 4px #0002}.msg{text-align:center;margin-top:12px;font-weight:900;color:#b33}
</style></head><body><div class="card"><div class="title">⚙️ 主控室登入</div><div class="sub">貨架整理小遊戲</div><input id="pw" type="password" placeholder="輸入主控密碼"><button id="login">登入主控室</button><div class="msg" id="msg"></div></div><script>
async function go(){msg.textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});const j=await r.json();if(!r.ok)throw new Error(j.error||'登入失敗');sessionStorage.setItem('adminToken',j.token);location.href='admin.html';}catch(e){msg.textContent=e.message}}
login.onclick=go;pw.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>
