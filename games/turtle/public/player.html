<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eef9f0">
<title>烏龜島大作戰</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--text:#493f3a;--muted:#786f69;--panel:#fff;--line:#e8e2da;--green:#5daf5b;--green2:#eaf7e8;--sand:#f4dda1}
body{margin:0;background:#f7faf7;color:var(--text);font-family:system-ui,"Noto Sans TC",sans-serif}
.page{max-width:620px;margin:auto;padding:10px}
.card{background:#fff;border:1px solid #e5ebe4;border-radius:18px;padding:13px;margin-bottom:9px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px}
.heroMain{display:flex;align-items:center;gap:9px;min-width:0}
.heroIcon{width:42px;height:42px;object-fit:contain}
.eyebrow{font-size:11px;font-weight:900;color:#6f8b6e}.hero h1{font-size:20px;margin:1px 0 0;white-space:nowrap}
.iconBtn{border:1px solid #d7e3d6;border-radius:11px;background:#f5fbf4;padding:8px 10px;font-weight:900;color:#496249}
.entry h2{font-size:18px;margin:0 0 10px}.field{display:flex;flex-direction:column;gap:6px;font-weight:900}.field input{min-height:46px;border:1px solid #ddd;border-radius:12px;padding:10px 12px;font-size:16px}
.summary{margin:10px 0;padding:10px 12px;border-radius:12px;background:#f4f8f4;font-size:13px;font-weight:850;line-height:1.55}
.diffChoice{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.diffBtn{flex:1 1 30%;min-height:44px;border:1px solid #d5ddd3;border-radius:12px;background:#fff;font-weight:950}.diffBtn.on{background:#e5f5e3;border-color:#68ad62;color:#39723a}
.primary{width:100%;border:0;border-radius:13px;padding:12px 14px;background:#62ad59;color:#fff;font-size:16px;font-weight:1000}
.secondary{width:100%;border:1px solid #dacfbf;border-radius:13px;padding:10px;background:#fff9ef;color:#765c3e;font-weight:950}
.hidden{display:none!important}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:7px}
.stat{background:#f3f8f3;border:1px solid #d9e6d7;border-radius:13px;padding:7px 5px;text-align:center;font-size:10px;font-weight:900;color:#6c7768}
.stat b{display:block;margin-top:1px;font-size:18px;color:#386e3d}
.statusLine{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 1px 7px;padding:6px 9px;border-radius:11px;background:#fff7e6;font-size:12px;font-weight:900;color:#7b5f36}
.progress{height:8px;background:#dce9d9;border-radius:8px;overflow:hidden;flex:1}.bar{height:100%;width:0;background:linear-gradient(90deg,#65b85d,#f2c75d);transition:.15s}
.board{position:relative;background:linear-gradient(#87d8e4 0 7%,#f3dda5 7%);border:2px solid #d8c281;border-radius:18px;padding:10px 5px 7px;height:min(64vh,610px);min-height:390px;overflow:hidden}
.board:before{content:"🌺  🌿  🌼  🌿  🌺";position:absolute;left:0;right:0;top:1px;text-align:center;font-size:12px}
.grid{display:grid;gap:4px;width:100%;height:100%;position:relative;z-index:2}
.cell{position:relative;min-width:0;min-height:0;overflow:visible}
.hole{position:absolute;inset:0}.hole svg{width:100%;height:100%;display:block}
.turtleViewport{position:absolute;left:4%;right:4%;top:3%;bottom:10%;overflow:hidden;z-index:5;pointer-events:none}
.turtle{position:absolute;left:3%;bottom:-2%;width:94%;height:94%;object-fit:contain;transform-origin:50% 90%;transform:translateY(118%) scale(.78);transition:transform .18s cubic-bezier(.2,.9,.25,1.25);pointer-events:none;filter:drop-shadow(0 3px 1px #4d372a44)}
.turtle.peek{transform:translateY(58%) scale(.92,.88)}.turtle.up{transform:translateY(4%) scale(1.05,1.08)}.turtle.hit{animation:bonk .22s ease-out}
@keyframes bonk{45%{transform:translateY(10%) scale(.94) rotate(-5deg)}100%{transform:translateY(118%) scale(.76)}}
.rim{position:absolute;left:13%;right:13%;bottom:9%;height:18%;z-index:8;pointer-events:none;background:radial-gradient(ellipse at 50% -42%,transparent 0 61%,#a67b51 63% 69%,#c99c69 70% 78%,transparent 79%);border-radius:50%}
.pop{position:absolute;z-index:30;left:50%;top:8%;transform:translateX(-50%);font-size:42px;font-weight:1000;line-height:1;color:#ff7046;-webkit-text-stroke:3px #fff;text-shadow:0 3px 0 #fff,0 6px 10px #55362655;animation:pop .95s cubic-bezier(.16,.8,.28,1) forwards;pointer-events:none;white-space:nowrap}
.pop.minus{color:#df4050}.pop.gold{color:#efa900;font-size:48px}.pop.again{color:#3187d1;font-size:30px}
@keyframes pop{0%{transform:translateX(-50%) translateY(15px) scale(.55);opacity:0}16%{transform:translateX(-50%) translateY(0) scale(1.22);opacity:1}72%{opacity:1}100%{transform:translateX(-50%) translateY(-74px) scale(1.05);opacity:0}}
.gameActions{display:flex;gap:7px;margin-top:7px}.gameActions button{flex:1}
.overlay{position:fixed;inset:0;background:#273d33d8;display:flex;align-items:center;justify-content:center;padding:16px;z-index:80}
.modal{width:min(430px,100%);max-height:86vh;overflow:auto;background:white;border-radius:21px;padding:16px}
.modal h2{margin:0 0 10px;text-align:center}.rules{display:grid;grid-template-columns:1fr 1fr;gap:7px}.rule{display:grid;grid-template-columns:52px 1fr;gap:7px;align-items:center;padding:7px;border-radius:12px;background:#faf7ef}.rule img{width:52px;height:52px;object-fit:contain}.rule strong{font-size:12px}.rule small{display:block;font-size:10px;line-height:1.35}.score{color:#de684d;font-weight:1000}
.resultText{text-align:center;line-height:1.65;font-weight:800}
@media(max-width:600px){
 .page{padding:6px}.card{padding:9px;margin-bottom:6px}.hero{padding:7px 9px}.heroIcon{width:35px;height:35px}.hero h1{font-size:18px}
 .hud{gap:4px}.stat{padding:5px 3px}.stat b{font-size:16px}.board{height:calc(100dvh - 236px);min-height:330px}
 .gameActions{margin-top:5px}.rules{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<main class="page">
<section class="card hero">
 <div class="heroMain"><img class="heroIcon" src="/games/turtle/assets/green.png" alt=""><div><div class="eyebrow">✨ 小遊戲館</div><h1>🐢 烏龜島大作戰</h1></div></div>
 <div><button id="soundToggle" class="iconBtn">🔊</button> <button id="showRules" class="iconBtn">規則</button></div>
</section>

<section id="entryCard" class="card entry">
 <h2>開始挑戰</h2>
 <label class="field"><span>玩家名稱</span><input id="playerName" maxlength="24" placeholder="輸入你的名稱"></label>
 <div id="settingSummary" class="summary">讀取設定中…</div>
 <div id="choiceBox" class="hidden">
   <div style="font-weight:950;margin-bottom:6px">選擇難度</div>
   <div class="diffChoice" id="diffChoice"></div>
 </div>
 <button id="start" class="primary">🎮 開始遊戲</button>
 <div id="entryMsg" class="summary hidden"></div>
</section>

<section id="gameCard" class="hidden">
 <div class="hud">
  <div class="stat"><span id="timeLabel">剩餘時間</span><b id="time">00:00</b></div>
  <div class="stat"><span>本局分數</span><b><span id="score">0</span><span id="targetWrap"> / <span id="targetShow">30</span></span></b></div>
  <div class="stat"><span>最高連擊</span><b id="best">0</b></div>
 </div>
 <div class="statusLine"><span id="msg">準備開始</span><div class="progress"><div id="bar" class="bar"></div></div></div>
 <div class="board"><div id="grid" class="grid"></div></div>
 <div class="gameActions"><button id="endFree" class="secondary hidden">■ 結束自由遊玩</button></div>
</section>
</main>

<div id="rulesOverlay" class="overlay hidden"><div class="modal"><h2>🐢 烏龜分數</h2><div id="ruleGrid" class="rules"></div><button id="closeRules" class="primary" style="margin-top:10px">關閉</button></div></div>
<div id="resultOverlay" class="overlay hidden"><div class="modal"><h2 id="resultTitle">🎉 本局結束</h2><div id="resultText" class="resultText"></div><button id="again" class="primary" style="margin-top:10px">🔄 再玩一次</button><button id="hall" class="secondary" style="margin-top:7px">🏠 返回遊戲廳</button></div></div>

<script>
const $=s=>document.querySelector(s);
const QS=new URLSearchParams(location.search),ACTIVITY=QS.get('activity')||'';
const IMAGES={green:'/games/turtle/assets/green.png',blue:'/games/turtle/assets/blue.png',gold:'/games/turtle/assets/gold.png',flower:'/games/turtle/assets/flower.png',sunglass:'/games/turtle/assets/sunglass.png',redcap:'/games/turtle/assets/redcap.png',sleep:'/games/turtle/assets/sleep.png',rock:'/games/turtle/assets/rock.png'};
const RULES=[
 {id:'green',name:'綠葉龜',score:'+1',desc:'一般烏龜，打中增加 1 分'},
 {id:'blue',name:'藍殼龜',score:'+2',desc:'需要打中 2 下，完成後 +2 分'},
 {id:'gold',name:'金龜',score:'+4',desc:'稀有烏龜，出現較短，打中 +4 分'},
 {id:'flower',name:'花花龜',score:'+2',desc:'打中 +2 分'},
 {id:'sunglass',name:'墨鏡龜',score:'+3',desc:'反應型烏龜，打中 +3 分'},
 {id:'redcap',name:'紅帽龜',score:'+2',desc:'快速縮回，打中 +2 分'},
 {id:'sleep',name:'睡睡龜',score:'+1',desc:'停留較久，打中 +1 分'},
 {id:'rock',name:'岩石龜',score:'-2',desc:'陷阱！誤點扣 2 分'}
];
const DIFF={
 easy:{label:'🌱 簡單',holes:9,cols:3,speed:'slow',max:2,rock:.05,fastSpecial:.15},
 normal:{label:'⭐ 標準',holes:16,cols:4,speed:'normal',max:3,rock:.10,fastSpecial:.25},
 hard:{label:'🔥 困難',holes:20,cols:5,speed:'fast',max:4,rock:.16,fastSpecial:.36}
};
let SETTINGS={difficultyMode:'host',difficulty:'normal',allowedDifficulties:['easy','normal','hard'],timeMode:'limited',minutes:3,targetMode:'limited',target:30};
let selectedDifficulty='normal',CURRENT_RUN=null,running=false,score=0,combo=0,best=0,timeSec=180,elapsedSec=0,active=new Map(),clock,spawner,token=0;
let SOUND_ON=true,AC=null;

async function api(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'操作失敗');return d}
function fmt(sec){sec=Math.max(0,sec|0);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function ensureAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(freq,dur,type='sine',vol=.10,slide=0){if(!SOUND_ON)return;ensureAudio();if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.linearRampToValueAtTime(Math.max(60,freq+slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.004,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)}
function sfx(k){if(k==='hit')tone(520,.06,'sine',.10,140);else if(k==='gold'){tone(720,.08,'triangle',.12,220);setTimeout(()=>tone(940,.10,'triangle',.10,180),55)}else if(k==='rock')tone(150,.14,'square',.085,-45);else if(k==='blue')tone(390,.06,'sine',.095,70);else if(k==='win'){tone(600,.10,'triangle',.12,180);setTimeout(()=>tone(820,.12,'triangle',.11,190),90);setTimeout(()=>tone(1040,.15,'triangle',.10,140),180)}}
function ruleById(id){return RULES.find(r=>r.id===id)}
function diff(){return DIFF[selectedDifficulty]||DIFF.normal}
function holeSVG(){return `<svg viewBox="0 0 256 220" xmlns="http://www.w3.org/2000/svg"><ellipse cx="128" cy="105" rx="116" ry="76" fill="#86c75f"/><ellipse cx="128" cy="116" rx="102" ry="66" fill="#c99b68"/><path d="M35 112 C46 174,75 204,128 207 C181 204,210 174,221 112 C201 145,174 160,128 162 C82 160,55 145,35 112Z" fill="#a8794d"/><ellipse cx="128" cy="113" rx="86" ry="51" fill="#5b4030"/><ellipse cx="128" cy="119" rx="70" ry="39" fill="#2f211a"/></svg>`}
function speedCfg(){return {slow:[780,190,1100],normal:[570,150,780],fast:[415,120,580]}[diff().speed]}

function renderChoices(){
 const allowed=(SETTINGS.allowedDifficulties||['easy','normal','hard']).filter(x=>DIFF[x]);
 if(!allowed.includes(selectedDifficulty))selectedDifficulty=allowed[0]||'normal';
 $('#diffChoice').innerHTML=allowed.map(d=>`<button type="button" class="diffBtn ${d===selectedDifficulty?'on':''}" data-d="${d}">${DIFF[d].label}<br><small>${d==='easy'?'3×3':d==='normal'?'4×4':'5×4'}</small></button>`).join('');
 document.querySelectorAll('.diffBtn').forEach(b=>b.onclick=()=>{selectedDifficulty=b.dataset.d;renderChoices()});
 $('#choiceBox').classList.toggle('hidden',SETTINGS.difficultyMode!=='player');
}

function updateSummary(){
 const time=SETTINGS.timeMode==='unlimited'?'不限時':SETTINGS.minutes+' 分鐘';
 const target=SETTINGS.targetMode==='unlimited'?'不限制分數':SETTINGS.target+' 分完成';
 const diffText=SETTINGS.difficultyMode==='player'?'玩家自選難度':DIFF[SETTINGS.difficulty]?.label||'標準';
 $('#settingSummary').textContent=`${diffText}｜${time}｜${target}`;
}

async function loadHallSettings(){
 try{
  const d=await api('/games/turtle/api/settings?activity='+encodeURIComponent(ACTIVITY));
  Object.assign(SETTINGS,d.settings||{});
  selectedDifficulty=SETTINGS.difficulty||'normal';
  renderChoices();updateSummary();update();
 }catch(e){$('#settingSummary').textContent='設定讀取失敗：'+e.message}
}
function makeBoard(){
 $('#grid').innerHTML='';active.clear();
 const d=diff(),rows=Math.ceil(d.holes/d.cols);
 $('#grid').style.gridTemplateColumns=`repeat(${d.cols},1fr)`;
 $('#grid').style.gridTemplateRows=`repeat(${rows},minmax(0,1fr))`;
 for(let i=0;i<d.holes;i++){
  const cell=document.createElement('div');cell.className='cell';cell.dataset.i=i;
  cell.innerHTML=`<div class="hole">${holeSVG()}</div><div class="turtleViewport"><img class="turtle" alt=""></div><div class="rim"></div>`;
  cell.onpointerdown=()=>hit(i,cell);$('#grid').appendChild(cell);
 }
}
function stop(){running=false;clearInterval(clock);clearInterval(spawner)}
function beginGame(){
 stop();token++;makeBoard();running=true;score=0;combo=0;best=0;elapsedSec=0;
 timeSec=SETTINGS.timeMode==='unlimited'?0:Math.max(1,+SETTINGS.minutes||1)*60;
 $('#entryCard').classList.add('hidden');$('#gameCard').classList.remove('hidden');
 $('#endFree').classList.toggle('hidden',SETTINGS.targetMode!=='unlimited');
 update();spawn();const c=speedCfg();spawner=setInterval(spawn,c[0]);
 clock=setInterval(()=>{if(SETTINGS.timeMode==='limited'){timeSec--;if(timeSec<=0){timeSec=0;update();finish(false);return}}else elapsedSec++;update()},1000);
}
async function startRun(){
 const player=$('#playerName').value.trim();
 if(!player){$('#entryMsg').textContent='請先輸入玩家名稱';$('#entryMsg').classList.remove('hidden');return}
 if(!ACTIVITY){$('#entryMsg').textContent='缺少活動碼，請從小遊戲館進入';$('#entryMsg').classList.remove('hidden');return}
 ensureAudio();$('#start').disabled=true;
 try{
  const d=await api('/games/turtle/api/start',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({activity:ACTIVITY,player,difficulty:selectedDifficulty})});
  CURRENT_RUN=d;Object.assign(SETTINGS,d.settings||{});selectedDifficulty=d.difficulty||selectedDifficulty;
  localStorage.setItem(`turtleName:${ACTIVITY}`,player);beginGame();
 }catch(e){$('#entryMsg').textContent='❌ '+e.message;$('#entryMsg').classList.remove('hidden')}finally{$('#start').disabled=false}
}
function weightedPick(){
 const d=diff(),r=Math.random();let id;
 if(r<d.rock)id='rock';else{const x=Math.random();if(x<.08)id='gold';else if(x<d.fastSpecial)id=Math.random()<.5?'sunglass':'redcap';else if(x<.47)id='blue';else if(x<.63)id='flower';else if(x<.78)id='sleep';else id='green'}
 return ruleById(id);
}
function spawn(){
 if(!running)return;const c=speedCfg(),cells=[...document.querySelectorAll('.cell')];if(active.size>=diff().max)return;
 const free=cells.filter((_,i)=>!active.has(i));if(!free.length)return;
 const cell=free[Math.floor(Math.random()*free.length)],i=+cell.dataset.i,im=cell.querySelector('.turtle'),r=weightedPick();
 im.src=IMAGES[r.id];im.className='turtle peek';active.set(i,{id:r.id,hp:r.id==='blue'?2:1,state:'peek',token});const z=token;
 let stay=c[2];if(['gold','sunglass','redcap'].includes(r.id))stay*=.78;if(r.id==='sleep')stay*=1.25;
 setTimeout(()=>{const a=active.get(i);if(!running||!a||a.token!==z)return;a.state='up';im.classList.replace('peek','up')},c[1]);
 setTimeout(()=>hide(i,true),c[1]+stay);if(Math.random()<.16)setTimeout(spawn,90);
}
function hide(i,miss){
 const a=active.get(i);if(!a)return;const cell=document.querySelectorAll('.cell')[i],im=cell?.querySelector('.turtle');if(im)im.className='turtle';active.delete(i);if(miss&&running&&a.id!=='rock'){combo=0;update()}
}
function pop(cell,text,cls=''){const p=document.createElement('div');p.className='pop '+cls;p.textContent=text;cell.appendChild(p);setTimeout(()=>p.remove(),1000)}
function hit(i,cell){
 if(!running||!active.has(i))return;const a=active.get(i);if(a.state!=='up')return;
 if(a.id==='blue'&&a.hp>1){a.hp--;combo++;best=Math.max(best,combo);sfx('blue');pop(cell,'再一下！','again');update();return}
 const r=ruleById(a.id),delta=parseInt(r.score,10);
 if(delta<0){score=Math.max(0,score+delta);combo=0;sfx('rock');pop(cell,r.score,'minus')}else{score+=delta;combo++;best=Math.max(best,combo);sfx(a.id==='gold'?'gold':'hit');pop(cell,r.score,a.id==='gold'?'gold':'')}
 cell.querySelector('.turtle').classList.add('hit');setTimeout(()=>hide(i,false),160);update();
 if(SETTINGS.targetMode==='limited'&&score>=SETTINGS.target)setTimeout(()=>finish(true),120);
}
function update(){
 $('#score').textContent=score;$('#best').textContent=best;$('#time').textContent=SETTINGS.timeMode==='unlimited'?fmt(elapsedSec):fmt(timeSec);
 $('#timeLabel').textContent=SETTINGS.timeMode==='unlimited'?'遊戲時間':'剩餘時間';$('#targetShow').textContent=SETTINGS.target;
 $('#targetWrap').style.display=SETTINGS.targetMode==='unlimited'?'none':'inline';$('#bar').style.width=SETTINGS.targetMode==='unlimited'?'0%':Math.min(100,score/SETTINGS.target*100)+'%';
 if(running)$('#msg').textContent=SETTINGS.targetMode==='unlimited'?`目前 ${score} 分｜自由挑戰中`:`還差 ${Math.max(0,SETTINGS.target-score)} 分`;
}
async function finish(win){
 if(!running)return;stop();[...active.keys()].forEach(i=>hide(i,false));
 let serverResult=null;
 if(CURRENT_RUN){try{serverResult=await api('/games/turtle/api/finish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({activity:ACTIVITY,player:$('#playerName').value.trim(),runId:CURRENT_RUN.runId,score,completed:win===true})})}catch(e){serverResult={error:e.message}}CURRENT_RUN=null}
 const realWin=serverResult?.completed===true,pr=serverResult?.prize;let prize='';
 if(realWin&&pr){if(pr.status==='awarded')prize=`<br><b>🎁 恭喜獲得：${pr.prizeName||'獎品'}</b>`;else if(pr.status==='limit_reached')prize='<br>本場已達可得獎次數上限';else if(['out_of_stock','game_out_of_stock','tier_out_of_stock'].includes(pr.status))prize='<br>獎品已領完'}
 $('#resultTitle').textContent=realWin?'🎉 挑戰成功！':(SETTINGS.targetMode==='unlimited'?'🎮 本局結束':'⏰ 本局未完成');
 $('#resultText').innerHTML=realWin?`本局 ${score} 分，已達成 ${SETTINGS.target} 分目標。${prize}`:(SETTINGS.targetMode==='unlimited'?`本局共獲得 ${score} 分。<br>本場設定為不限制分數，不觸發完成得獎。`:`本局 ${score} 分，目標 ${SETTINGS.target} 分。${serverResult?.error?'<br>'+serverResult.error:''}`);
 if(realWin)sfx('win');$('#resultOverlay').classList.remove('hidden');
}
function resetEntry(){$('#resultOverlay').classList.add('hidden');$('#gameCard').classList.add('hidden');$('#entryCard').classList.remove('hidden');renderChoices();updateSummary()}
$('#ruleGrid').innerHTML=RULES.map(r=>`<div class="rule"><img src="${IMAGES[r.id]}"><div><strong>${r.name} <span class="score">${r.score}</span></strong><small>${r.desc}</small></div></div>`).join('');
$('#showRules').onclick=()=>$('#rulesOverlay').classList.remove('hidden');$('#closeRules').onclick=()=>$('#rulesOverlay').classList.add('hidden');
$('#soundToggle').onclick=()=>{SOUND_ON=!SOUND_ON;ensureAudio();$('#soundToggle').textContent=SOUND_ON?'🔊':'🔇'};
$('#start').onclick=startRun;$('#endFree').onclick=()=>finish(false);$('#again').onclick=resetEntry;$('#hall').onclick=()=>location.href='/?activity='+encodeURIComponent(ACTIVITY);
const saved=localStorage.getItem(`turtleName:${ACTIVITY}`);if(saved)$('#playerName').value=saved;
makeBoard();update();loadHallSettings();
</script>
</body>
</html>
