<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>烏龜島大作戰｜小遊戲館</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg1:#83ddf8;--bg2:#e2f4bd;--cream:#fff8e8;--brown:#5a3c2a;--green:#58a64b;--pink:#ff7797}
body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:linear-gradient(var(--bg1) 0 18%,var(--bg2) 18%);color:#463329;min-height:100vh;overflow-x:hidden}
.app{max-width:580px;margin:auto;padding:6px;min-height:100vh;display:flex;flex-direction:column}
.hero{display:flex;align-items:center;gap:7px;background:linear-gradient(#8dd45f,#4ea647);border:3px solid #fff0b5;border-radius:18px;padding:5px 9px;box-shadow:0 4px #377d39;flex:0 0 auto}
.hero img{width:46px;height:46px;object-fit:contain;flex:0 0 auto}
.heroText{min-width:0;flex:1}.heroTitle{font-size:21px;font-weight:1000;color:#fff8c8;text-shadow:0 3px #4e7137;line-height:1.05}.heroSub{font-size:11px;font-weight:900;color:#305631;margin-top:4px}
.topActions{display:flex;justify-content:space-between;align-items:center;margin:5px 0;gap:6px;flex:0 0 auto}
.soundBtn{border:0;background:#eef7ff;border:2px solid #9ecbea;border-radius:12px;padding:7px 10px;font-weight:1000;color:#355d75;box-shadow:0 3px #78a7c6}.ruleBtn{border:0;background:#fff7df;border:2px solid #deb074;border-radius:12px;padding:7px 11px;font-weight:1000;color:#6a442c;box-shadow:0 3px #bf8955}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:0 0 auto}
.stat{background:linear-gradient(#246f98,#164c6c);color:#fff;border:3px solid #a4ddff;border-radius:16px;text-align:center;padding:4px;font-size:10px;font-weight:900;box-shadow:0 3px #123e57}
.stat b{display:block;color:#ffe25e;font-size:18px}
.progress{height:13px;background:#c7d9ae;border:2px solid white;border-radius:10px;overflow:hidden;margin:5px 3px}
.bar{height:100%;width:0;background:linear-gradient(90deg,#73d35a,#ffe063,#ff9d71);transition:.15s}
.msg{margin:4px 0;background:#fff0c8;border:2px solid #e6b972;border-radius:12px;text-align:center;padding:5px;font-weight:1000;color:#aa5a3d}
.board{background:linear-gradient(#70d1df 0 8%,#f2d99d 8%);border:3px solid #fff3ba;border-radius:20px;padding:10px 5px 8px;box-shadow:0 5px #72a65c;position:relative;overflow:hidden;flex:1 1 auto;min-height:430px;display:flex;align-items:stretch}
.board:before{content:"🌺　🌿　🌼　🌿　🌺";position:absolute;top:0;left:0;right:0;text-align:center;font-size:14px}
.grid{display:grid;gap:4px;position:relative;z-index:2;width:100%;height:100%;align-content:stretch;justify-content:stretch}
.cell{position:relative;min-width:0;min-height:0;overflow:visible;display:flex;align-items:flex-end;justify-content:center}
.hole{position:absolute;left:0;right:0;top:0;bottom:0;overflow:visible}.hole svg{width:100%;height:100%;display:block}
.turtleViewport{position:absolute;left:4%;right:4%;top:3%;bottom:10%;overflow:hidden;z-index:5;pointer-events:none}.turtle{position:absolute;left:3%;bottom:-2%;width:94%;height:94%;object-fit:contain;transform-origin:50% 90%;transform:translateY(118%) scale(.78);transition:transform .18s cubic-bezier(.2,.9,.25,1.25);pointer-events:none;filter:drop-shadow(0 3px 1px #4d372a44)}
.turtle.peek{transform:translateY(58%) scale(.92,.88)}.turtle.up{transform:translateY(4%) scale(1.05,1.08)}.turtle.hit{animation:bonk .22s ease-out}
@keyframes bonk{45%{transform:translateY(10%) scale(.94) rotate(-5deg)}100%{transform:translateY(118%) scale(.76)}}
/* slimmer soil-only foreground cover; no green ring */
.rim{position:absolute;left:13%;right:13%;bottom:9%;height:18%;z-index:8;pointer-events:none;background:radial-gradient(ellipse at 50% -42%,transparent 0 61%,#a67b51 63% 69%,#c99c69 70% 78%,transparent 79%);border-radius:50%}
.pop{position:absolute;z-index:20;left:50%;top:12%;transform:translateX(-50%);font-size:34px;font-weight:1000;line-height:1;color:#ff653f;-webkit-text-stroke:2px #fff;text-shadow:0 3px 0 #fff,0 5px 8px #623d2f66;animation:pop .82s cubic-bezier(.16,.8,.28,1) forwards;pointer-events:none;white-space:nowrap}.pop.minus{color:#e13f4e}.pop.gold{color:#f4a900;font-size:40px}.pop.again{color:#3b8fd8;font-size:26px}
@keyframes pop{0%{transform:translateX(-50%) translateY(12px) scale(.65);opacity:0}18%{transform:translateX(-50%) translateY(0) scale(1.2);opacity:1}70%{opacity:1}100%{transform:translateX(-50%) translateY(-64px) scale(1.05);opacity:0}}
.playerField{display:flex;align-items:center;gap:7px;margin-bottom:6px;font-size:12px;font-weight:1000}.playerField input{min-width:0;flex:1;border:2px solid #dfb176;border-radius:10px;padding:8px 10px;font:inherit;font-size:16px;background:#fff}
.bottom{margin-top:6px;background:#fff7e6;border:3px solid #dfb176;border-radius:18px;padding:9px}
.gameInfo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:11px;font-weight:900;text-align:center}
.gameInfo div{background:#f2dfbd;border-radius:10px;padding:7px}
.startBtn{width:100%;margin-top:6px;border:0;border-radius:15px;padding:13px;font-size:18px;font-weight:1000;background:linear-gradient(#ffcb70,#ff789a);color:#5b3024;box-shadow:0 4px #c6556b}
.startBtn:disabled{opacity:.55}
.overlay{position:fixed;inset:0;background:#244437d9;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}
.card{width:min(430px,100%);max-height:88vh;overflow:auto;background:#fff8df;border:5px solid white;border-radius:27px;padding:16px}
.card h2{text-align:center;color:#63a348;margin:3px 0 10px}
.ruleGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.rule{background:#f5e6c9;border-radius:12px;padding:7px;display:grid;grid-template-columns:54px 1fr;gap:6px;align-items:center}
.rule img{width:54px;height:54px;object-fit:contain}
.rule strong{font-size:12px}.rule .score{font-weight:1000;color:#e66e48}.rule small{display:block;font-size:10px;line-height:1.35}
.closeBtn{width:100%;margin-top:10px;border:0;border-radius:13px;padding:11px;font-weight:1000;background:#8ed7b8;color:#244b3d}
.hidden{display:none}
.result{text-align:center}

@media(max-width:600px){
 body{overflow:hidden}
 .app{height:100dvh;max-height:100dvh;min-height:0}
 .board{min-height:0}
 .heroSub{display:none}
 .topActions{margin:4px 0}
 .ruleBtn,.soundBtn{padding:5px 8px;font-size:11px;box-shadow:none}
 .progress{height:10px}
 .msg{font-size:11px}
 .bottom{padding:6px 8px}
 .gameInfo{gap:4px;font-size:9px}
 .gameInfo div{padding:4px}
 .startBtn{padding:9px;font-size:15px}
 .board:before{font-size:11px}
}
@media(max-height:740px) and (max-width:600px){
 .hero img{width:38px;height:38px}
 .heroTitle{font-size:18px}
 .stat b{font-size:15px}
 .msg{padding:3px}
 .bottom{margin-top:4px}
}

@media(min-width:601px){
 .app{min-height:900px}
 .board{height:610px;flex:0 0 auto}
 .grid{height:100%}
 .cell{min-height:110px}
}

@media(max-width:600px){
 .grid{grid-auto-rows:minmax(0,1fr)}
 .cell{min-height:0}
}
</style></head>

const RULES=[{"id": "green", "name": "綠葉龜", "score": "+1", "desc": "一般烏龜，打中增加 1 分"}, {"id": "blue", "name": "藍殼龜", "score": "+2", "desc": "需要連續打中 2 下才算成功，完成後 +2 分"}, {"id": "gold", "name": "金龜", "score": "+4", "desc": "稀有烏龜，出現時間較短，打中 +4 分"}, {"id": "flower", "name": "花花龜", "score": "+2", "desc": "可愛花花龜，打中 +2 分"}, {"id": "sunglass", "name": "墨鏡龜", "score": "+3", "desc": "反應型烏龜，停留時間較短，打中 +3 分"}, {"id": "redcap", "name": "紅帽龜", "score": "+2", "desc": "快速縮回的烏龜，打中 +2 分"}, {"id": "sleep", "name": "睡睡龜", "score": "+1", "desc": "停留時間較長，打中 +1 分"}, {"id": "rock", "name": "岩石龜", "score": "-2", "desc": "陷阱！不要打，誤點扣 2 分"}];
const $=s=>document.querySelector(s),grid=$('#grid');
let SOUND_ON=true;
let audioCtx=null;
function ensureAudio(){
 try{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
 }catch(e){}
}
function tone(freq=440,dur=.06,type='sine',vol=.04,slide=0){
 if(!SOUND_ON)return;
 ensureAudio(); if(!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;
 o.type=type;o.frequency.setValueAtTime(freq,t);
 if(slide)o.frequency.linearRampToValueAtTime(freq+slide,t+dur);
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.004,t+dur);
 o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur);
}
function sfx(kind){
 if(kind==='hit')tone(520,.06,'sine',.10,140);
 else if(kind==='gold'){tone(720,.08,'triangle',.12,220);setTimeout(()=>tone(940,.10,'triangle',.10,180),55)}
 else if(kind==='rock')tone(150,.14,'square',.085,-45);
 else if(kind==='blue')tone(390,.06,'sine',.095,70);
 else if(kind==='win'){tone(600,.10,'triangle',.12,180);setTimeout(()=>tone(820,.12,'triangle',.11,190),90);setTimeout(()=>tone(1040,.15,'triangle',.10,140),180)}
}




let SETTINGS={difficultyMode:'host',difficulty:'normal',timeMode:'limited',minutes:3,targetMode:'limited',target:30};
const QS=new URLSearchParams(location.search),ACTIVITY=QS.get('activity')||'';
let CURRENT_RUN=null;
async function api(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'操作失敗');return d}
async function loadHallSettings(){try{const d=await api('/games/turtle/api/settings');Object.assign(SETTINGS,d.settings||{});selectedDifficulty=SETTINGS.difficulty||'normal';timeSec=SETTINGS.minutes*60;makeBoard();updateInfo();update()}catch(e){$('#msg').textContent='設定讀取失敗：'+e.message}}
const DIFF={
 easy:{label:'🌱 簡單',holes:9,cols:3,speed:'slow',max:2,rock:.05,fastSpecial:.15},
 normal:{label:'⭐ 標準',holes:16,cols:4,speed:'normal',max:3,rock:.10,fastSpecial:.25},
 hard:{label:'🔥 困難',holes:20,cols:5,speed:'fast',max:4,rock:.16,fastSpecial:.36}
};
let selectedDifficulty=SETTINGS.difficulty||'normal';
let running=false,score=0,combo=0,best=0,timeSec=SETTINGS.minutes*60,elapsedSec=0,active=new Map(),clock,spawner,token=0;

function holeSVG(){return `<svg viewBox="0 0 256 220" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="128" cy="105" rx="116" ry="76" fill="#86c75f"/>
<ellipse cx="128" cy="116" rx="102" ry="66" fill="#c99b68"/>
<path d="M35 112 C46 174,75 204,128 207 C181 204,210 174,221 112 C201 145,174 160,128 162 C82 160,55 145,35 112Z" fill="#a8794d"/>
<ellipse cx="128" cy="113" rx="86" ry="51" fill="#5b4030"/>
<ellipse cx="128" cy="119" rx="70" ry="39" fill="#2f211a"/>
</svg>`}
function ruleById(id){return RULES.find(r=>r.id===id)}
function diff(){return DIFF[selectedDifficulty]||DIFF.normal}
function fmt(sec){sec=Math.max(0,sec|0);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}

function updateInfo(){
 const d=diff();
 $('#infoDifficulty').textContent=d.label;
 $('#infoTime').textContent=SETTINGS.timeMode==='unlimited'?'不限時':SETTINGS.minutes+' 分鐘';
 $('#infoTarget').textContent=SETTINGS.targetMode==='unlimited'?'不限制分數':SETTINGS.target+' 分';
 $('#targetWrap').style.display=SETTINGS.targetMode==='unlimited'?'none':'inline';
 $('#targetShow').textContent=SETTINGS.target;
 $('#timeLabel').textContent=SETTINGS.timeMode==='unlimited'?'遊戲時間':'剩餘時間';
}

function makeBoard(){
 grid.innerHTML='';active.clear();
 const d=diff(), n=d.holes;
 grid.style.gridTemplateColumns=`repeat(${d.cols},1fr)`;
 const rows=Math.ceil(n/d.cols);
 grid.style.gridTemplateRows=`repeat(${rows},minmax(72px,1fr))`;
 for(let i=0;i<n;i++){
  const cell=document.createElement('div');
  cell.className='cell'; cell.dataset.i=i;
  cell.innerHTML=`<div class="hole">${holeSVG()}</div><div class="turtleViewport"><img class="turtle" alt=""></div><div class="rim"></div>`;
  cell.onpointerdown=()=>hit(i,cell);
  grid.appendChild(cell);
 }
}

function speedCfg(){
 return {
  slow:[780,190,1100],
  normal:[570,150,780],
  fast:[415,120,580]
 }[diff().speed];
}

function stop(){
 running=false;clearInterval(clock);clearInterval(spawner);
}

function beginGame(){
 stop(); token++; makeBoard();
 running=true; score=0; combo=0; best=0; elapsedSec=0;
 timeSec=SETTINGS.timeMode==='unlimited'?0:Math.max(1,+SETTINGS.minutes||1)*60;
 updateInfo(); update();
 $('#start').disabled=true;
 $('#endFree').classList.toggle('hidden',SETTINGS.targetMode!=='unlimited');
 $('#msg').textContent='開始！注意洞口 👀';
 spawn();
 const c=speedCfg();
 spawner=setInterval(spawn,c[0]);
 clock=setInterval(()=>{
  if(SETTINGS.timeMode==='limited'){
   timeSec--;
   if(timeSec<=0){
    timeSec=0; update();
    finish(SETTINGS.targetMode==='unlimited'?'free':false);
    return;
   }
  }else elapsedSec++;
  update();
 },1000);
}

async function startRun(){
 const player=$('#playerName').value.trim();if(!player){$('#msg').textContent='請先輸入玩家名稱';$('#playerName').focus();return}
 $('#start').disabled=true;$('#msg').textContent='正在建立本局…';
 try{const d=await api('/games/turtle/api/start',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({activity:ACTIVITY,player,difficulty:selectedDifficulty})});CURRENT_RUN=d;Object.assign(SETTINGS,d.settings||{});selectedDifficulty=d.difficulty||selectedDifficulty;beginGame()}
 catch(e){$('#start').disabled=false;$('#msg').textContent=e.message;alert('❌ '+e.message)}
}
function start(){
 ensureAudio();
 if(!ACTIVITY){$('#msg').textContent='缺少活動碼，請從小遊戲館進入';return}
 if(!$('#playerName').value.trim()){ $('#msg').textContent='請先輸入玩家名稱';$('#playerName').focus();return }
 if(SETTINGS.difficultyMode==='player')$('#difficultyOverlay').classList.remove('hidden');
 else{selectedDifficulty=SETTINGS.difficulty||'normal';startRun()}
}

function weightedPick(){
 const d=diff();
 const r=Math.random();
 let id;
 if(r<d.rock) id='rock';
 else{
  const x=Math.random();
  if(x<.08) id='gold';
  else if(x<d.fastSpecial) id=Math.random()<.5?'sunglass':'redcap';
  else if(x<.47) id='blue';
  else if(x<.63) id='flower';
  else if(x<.78) id='sleep';
  else id='green';
 }
 return ruleById(id);
}

function spawn(){
 if(!running)return;
 const c=speedCfg(), cells=[...document.querySelectorAll('.cell')];
 if(active.size>=diff().max)return;
 const free=cells.filter((_,i)=>!active.has(i));
 if(!free.length)return;
 const cell=free[Math.floor(Math.random()*free.length)];
 const i=+cell.dataset.i, im=cell.querySelector('.turtle'), r=weightedPick();
 im.src=IMAGES[r.id]; im.className='turtle peek';
 active.set(i,{id:r.id,hp:r.id==='blue'?2:1,state:'peek',token});
 const z=token;
 let stay=c[2];
 if(r.id==='gold'||r.id==='sunglass'||r.id==='redcap')stay*=.78;
 if(r.id==='sleep')stay*=1.25;
 setTimeout(()=>{
  const a=active.get(i);
  if(!running||!a||a.token!==z)return;
  a.state='up'; im.classList.replace('peek','up');
 },c[1]);
 setTimeout(()=>hide(i,true),c[1]+stay);
 if(Math.random()<.16)setTimeout(spawn,90);
}

function hide(i,miss){
 const a=active.get(i); if(!a)return;
 const cell=document.querySelectorAll('.cell')[i], im=cell?.querySelector('.turtle');
 if(im)im.className='turtle';
 active.delete(i);
 if(miss&&running&&a.id!=='rock'){combo=0;update()}
}

function hit(i,cell){
 if(!running||!active.has(i))return;
 const a=active.get(i); if(a.state!=='up')return;
 if(a.id==='blue'&&a.hp>1){
  a.hp--; combo++; best=Math.max(best,combo);
  sfx('blue');pop(cell,'再一下！','again'); update(); return;
 }
 const r=ruleById(a.id), delta=parseInt(r.score,10);
 if(delta<0){
  score=Math.max(0,score+delta); combo=0; sfx('rock'); pop(cell,r.score+'','minus');
 }else{
  score+=delta; combo++; best=Math.max(best,combo); sfx(a.id==='gold'?'gold':'hit'); pop(cell,r.score+'',a.id==='gold'?'gold':'');
 }
 cell.querySelector('.turtle').classList.add('hit');
 setTimeout(()=>hide(i,false),160);
 update();
 if(SETTINGS.targetMode==='limited'&&score>=SETTINGS.target)setTimeout(()=>finish(true),120);
}

function pop(c,x,cls=''){const p=document.createElement('div');p.className='pop '+cls;p.textContent=x;c.appendChild(p);setTimeout(()=>p.remove(),900)}

function update(){
 $('#score').textContent=score;
 $('#time').textContent=SETTINGS.timeMode==='unlimited'?fmt(elapsedSec):fmt(timeSec);
 $('#best').textContent=best;
 $('#targetShow').textContent=SETTINGS.target;
 $('#targetWrap').style.display=SETTINGS.targetMode==='unlimited'?'none':'inline';
 $('#bar').style.width=SETTINGS.targetMode==='unlimited'?'0%':Math.min(100,score/SETTINGS.target*100)+'%';
 if(running){
  $('#msg').textContent=SETTINGS.targetMode==='unlimited'
   ?`目前 ${score} 分｜自由挑戰中`
   :`還差 ${Math.max(0,SETTINGS.target-score)} 分完成`;
 }
}

async function finish(win){
 if(!running)return;
 stop(); $('#endFree').classList.add('hidden');
 [...active.keys()].forEach(i=>hide(i,false));
 $('#start').disabled=false;
 let serverResult=null;
 if(CURRENT_RUN){try{serverResult=await api('/games/turtle/api/finish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({activity:ACTIVITY,player:$('#playerName').value.trim(),runId:CURRENT_RUN.runId,score,completed:win===true})})}catch(e){serverResult={error:e.message}}CURRENT_RUN=null}
 const realWin=serverResult?.completed===true;
 $('#resultTitle').textContent=win==='free'?'🎮 本局結束':(realWin?'🎉 挑戰成功！':'⏰ 本局未完成');
 let prize='';const pr=serverResult?.prize;if(realWin&&pr){if(pr.status==='awarded')prize=`<br><b>🎁 恭喜獲得：${pr.prizeName}</b>`;else if(pr.status==='limit_reached')prize='<br>本場已達可得獎次數上限';else if(['out_of_stock','game_out_of_stock','tier_out_of_stock'].includes(pr.status))prize='<br>獎品已領完';}
 $('#resultText').innerHTML=win==='free'?`本局共獲得 ${score} 分。<br>本場設定為不限制分數，不觸發完成得獎。`:(realWin?`已達成 ${SETTINGS.target} 分目標。${prize}`:`本局 ${score} 分${SETTINGS.targetMode==='limited'?'，目標 '+SETTINGS.target+' 分':''}${serverResult?.error?'<br>'+serverResult.error:''}`);
 if(realWin)sfx('win');$('#resultOverlay').classList.remove('hidden');
}
$('#ruleGrid').innerHTML=RULES.map(r=>`<div class="rule"><img src="${IMAGES[r.id]}"><div><strong>${r.name} <span class="score">${r.score}</span></strong><small>${r.desc}</small></div></div>`).join('');
$('#soundToggle').onclick=()=>{
 SOUND_ON=!SOUND_ON;ensureAudio();
 $('#soundToggle').textContent=SOUND_ON?'🔊 音效':'🔇 靜音';
};
$('#showRules').onclick=()=>$('#rulesOverlay').classList.remove('hidden');$('#closeRules').onclick=()=>$('#rulesOverlay').classList.add('hidden');
document.querySelectorAll('.diffPick').forEach(b=>b.onclick=()=>{ensureAudio();selectedDifficulty=b.dataset.d;$('#difficultyOverlay').classList.add('hidden');startRun()});
$('#endFree').onclick=()=>finish('free');
$('#start').onclick=start;$('#again').onclick=()=>{$('#resultOverlay').classList.add('hidden');start()};
selectedDifficulty=SETTINGS.difficulty||'normal';
makeBoard();updateInfo();update();loadHallSettings();
let lastW=window.innerWidth;
window.addEventListener('resize',()=>{
 if(Math.abs(window.innerWidth-lastW)>80 && !running){
  lastW=window.innerWidth; makeBoard();
 }
});
</script></body></html>
