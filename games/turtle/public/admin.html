<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>烏龜島大作戰設定</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#fff;color:#473c4b;font-family:system-ui,"Noto Sans TC",sans-serif}
.page{max-width:820px;margin:0}
.card{background:#fff;border:1px solid #eee4f0;border-radius:18px;padding:16px;box-shadow:none}
h2{margin:0 0 5px;font-size:23px}p{margin:0 0 14px;color:#756b79;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:7px;font-weight:950}
.field select{width:100%;min-height:46px;border:1px solid #ddd2e2;border-radius:12px;padding:8px 11px;background:#fff;font-size:15px;font-weight:850;color:#493f4d}
.toggle-row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:15px;background:linear-gradient(135deg,#f3edff,#fff2f8);border:1px solid #e4d8f0;font-weight:1000}
.toggle-row input,.chip input{width:auto!important;min-width:auto!important;margin:0;accent-color:#7a55cf}
.subhead{font-weight:1000;color:#68527c;margin:3px 0 7px}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #e2d7e9;border-radius:12px;background:#faf7fd;font-weight:900}
.host-only.dimmed{opacity:.45;filter:saturate(.6)}
.note{margin-top:12px;padding:11px 13px;border-radius:14px;background:#f6f1ff;color:#6c5b7b;font-weight:800;line-height:1.55}
.ruleSummary{margin-top:12px;padding:10px 12px;border-radius:13px;background:#fff8e8;color:#654d36;font-size:13px;font-weight:950;line-height:1.8}
.actions{margin-top:14px}
.primary{width:100%;border:0;border-radius:13px;padding:12px 14px;background:#7656cf;color:white;font-size:16px;font-weight:1000;cursor:pointer}
.status{margin-top:10px;padding:10px;border-radius:12px;background:#eef8f1;font-weight:900}.hidden{display:none}
@media(max-width:620px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<main class="page">
<section class="card">
<h2>🐢 烏龜島大作戰設定</h2>
<p>設定方式與小遊戲館其他遊戲一致：直接勾選與選項，不需要另外輸入分鐘或分數。</p>

<div class="grid">
  <label class="toggle-row full"><input id="selfSelect" type="checkbox"> <span>允許玩家自選難度</span></label>

  <div class="field full">
    <span>開放難度</span>
    <div class="checks">
      <label class="chip"><input class="adiff" type="checkbox" value="easy"> 🌱 簡單｜3×3</label>
      <label class="chip"><input class="adiff" type="checkbox" value="normal"> ⭐ 標準｜4×4</label>
      <label class="chip"><input class="adiff" type="checkbox" value="hard"> 🔥 困難｜5×4</label>
    </div>
  </div>

  <label class="field host-only">
    <span>主控指定難度</span>
    <select id="difficulty">
      <option value="easy">🌱 簡單｜3×3</option>
      <option value="normal">⭐ 標準｜4×4</option>
      <option value="hard">🔥 困難｜5×4</option>
    </select>
  </label>

  <label class="field">
    <span>遊戲時間</span>
    <select id="timeMinutes">
      <option value="1">1 分鐘</option>
      <option value="2">2 分鐘</option>
      <option value="3">3 分鐘</option>
      <option value="5">5 分鐘</option>
      <option value="10">10 分鐘</option>
      <option value="15">15 分鐘</option>
      <option value="20">20 分鐘</option>
      <option value="30">30 分鐘</option>
      <option value="0">不限時</option>
    </select>
  </label>

  <label class="field full">
    <span>完成條件</span>
    <select id="targetScore">
      <option value="10">10 分</option>
      <option value="20">20 分</option>
      <option value="30">30 分</option>
      <option value="50">50 分</option>
      <option value="80">80 分</option>
      <option value="100">100 分</option>
      <option value="150">150 分</option>
      <option value="200">200 分</option>
      <option value="250">250 分</option>
      <option value="300">300 分</option>
      <option value="0">不限制分數</option>
    </select>
  </label>
</div>

<div class="note">
簡單＝3×3、標準＝4×4、困難＝5×4；速度、同時出現數量與特殊烏龜比例由系統依難度自動調整。
開啟玩家自選後，玩家只會看到主控勾選開放的難度。
</div>

<div class="ruleSummary">
綠葉 +1　｜　藍殼 2 下 +2　｜　金龜 +4　｜　花花 +2　｜　墨鏡 +3　｜　紅帽 +2　｜　睡睡 +1　｜　岩石 -2
</div>

<div class="actions"><button id="saveBtn" class="primary">💾 儲存設定</button></div>
<div id="saveMsg" class="status hidden"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
async function api(u,o){
  const r=await fetch(u,o),d=await r.json().catch(()=>({}));
  if(r.status===401){top.location='/admin-login.html';throw 0}
  if(!r.ok)throw new Error(d.message||'操作失敗');
  return d;
}
function sync(){
  document.querySelectorAll('.host-only').forEach(x=>x.classList.toggle('dimmed',$('selfSelect').checked));
}
function setAllowed(list){
  const allowed=Array.isArray(list)&&list.length?list:['easy','normal','hard'];
  document.querySelectorAll('.adiff').forEach(x=>x.checked=allowed.includes(x.value));
}
async function load(){
  const d=await api('/api/game-settings/turtle'),s=d.settings||{};
  $('selfSelect').checked=s.difficultyMode==='player';
  $('difficulty').value=s.difficulty||'normal';
  setAllowed(s.allowedDifficulties);
  $('timeMinutes').value=s.timeMode==='unlimited'?'0':String(s.minutes||3);
  $('targetScore').value=s.targetMode==='unlimited'?'0':String(s.target||30);
  sync();
}
$('selfSelect').onchange=sync;
$('saveBtn').onclick=async()=>{
  try{
    const allowedDifficulties=[...document.querySelectorAll('.adiff:checked')].map(x=>x.value);
    if(!allowedDifficulties.length)return alert('至少要勾選一個開放難度');
    const time=+$('timeMinutes').value;
    const target=+$('targetScore').value;
    const payload={
      difficultyMode:$('selfSelect').checked?'player':'host',
      difficulty:$('difficulty').value,
      allowedDifficulties,
      timeMode:time===0?'unlimited':'limited',
      minutes:time===0?3:time,
      targetMode:target===0?'unlimited':'limited',
      target:target===0?30:target
    };
    await api('/api/game-settings/turtle',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
    $('saveMsg').textContent='✅ 烏龜島設定已儲存';
    $('saveMsg').classList.remove('hidden');
  }catch(e){
    $('saveMsg').textContent='❌ '+e.message;
    $('saveMsg').classList.remove('hidden');
  }
};
load();
</script>
</body>
</html>
