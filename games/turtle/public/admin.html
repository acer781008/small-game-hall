<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>烏龜島大作戰｜主控設定</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans TC",sans-serif;background:#f4f7fb;color:#283747}
.wrap{max-width:760px;margin:auto;padding:14px}.head{display:flex;align-items:center;gap:9px;margin-bottom:12px}.head img{width:58px;height:58px;object-fit:contain}
h1{font-size:24px;margin:0}.sub{font-size:12px;color:#66717e}.card{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 4px 15px #1e354a12}
.blue{border-top:6px solid #b9e2ff}.orange{border-top:6px solid #ffd6a2}.pink{border-top:6px solid #ffc5d8}.green{border-top:6px solid #bce7c5}
h3{margin:0 0 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label,.label{font-size:13px;font-weight:900}
select,input{width:100%;margin-top:5px;padding:10px;border:2px solid #d7dfe9;border-radius:11px;background:#fff;font-weight:800}
.segment{display:flex;gap:6px;margin-top:5px}.segment button{flex:1;padding:9px 5px;border:2px solid #d8e0e8;background:#fff;border-radius:10px;font-weight:900}
.segment button.on{background:#dff2ff;border-color:#76bfe9;color:#24668e}
.note{font-size:11px;line-height:1.5;background:#fff5d9;border-radius:10px;padding:8px;margin-top:9px}
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.r{text-align:center;background:#f8fafc;border-radius:11px;padding:5px}.r img{width:54px;height:54px;object-fit:contain}.r strong,.r small{display:block;font-size:10px}.r small{font-weight:1000;color:#d45d48}
.btn{width:100%;margin-top:10px;border:0;border-radius:12px;padding:12px;background:#65b8ea;color:#fff;font-size:16px;font-weight:1000}
.ruleSummary{font-size:12px;font-weight:900;line-height:1.8;background:#fff8e8;border-radius:11px;padding:8px 10px}
.miniToggle{width:100%;margin-top:7px;border:0;border-radius:10px;padding:8px;background:#f0dcc0;font-weight:900;color:#63462d}
.ruleDetails{margin-top:8px}
.hidden{display:none}@media(max-width:560px){.grid{grid-template-columns:1fr}.rules{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="wrap">

<div class="card blue"><h3>🎮 遊戲管理</h3>
<div class="grid">
 <div class="label">難度方式
  <select id="difficultyMode"><option value="host">主控指定</option><option value="player">開放玩家自選</option></select>
 </div>
 <div class="label" id="hostDifficultyBox">主控難度
  <select id="difficulty"><option value="easy">🌱 簡單｜3×3</option><option value="normal" selected>⭐ 標準｜4×4</option><option value="hard">🔥 困難｜5×4</option></select>
 </div>
 <div class="label">遊戲時間
  <select id="timeMode"><option value="limited">指定時間</option><option value="unlimited">♾️ 不限時</option></select>
  <div id="minutesBox"><input id="minutes" type="number" min="1" max="999" value="3" inputmode="numeric"><small>分鐘</small></div>
 </div>
 <div class="label">完成目標
  <select id="targetMode"><option value="limited">指定分數</option><option value="unlimited">♾️ 不限制分數</option></select>
  <div id="targetBox"><input id="target" type="number" min="1" max="99999" value="30" inputmode="numeric"><small>分</small></div>
 </div>
</div>
<div class="note">盤面、速度、同時出現數量及特殊烏龜比例由「簡單／標準／困難」自動配置。玩家自選時，玩家只選難度，不會另外選速度或格數。</div>
<button class="btn" id="save">儲存遊戲設定</button>
</div>

<div class="card orange"><h3>📖 烏龜分數</h3>
<div class="ruleSummary">綠葉 +1　｜　藍殼 2 下 +2　｜　金龜 +4　｜　花花 +2　｜　墨鏡 +3　｜　紅帽 +2　｜　睡睡 +1　｜　岩石 -2</div>
<button class="miniToggle" id="toggleRules">查看詳細規則</button>
<div class="ruleDetails hidden" id="ruleDetails">
<div class="note">三種難度都有加分與扣分烏龜；岩石龜是扣分陷阱。詳細效果玩家頁也能直接查看。</div>
</div>
</div>
<div class="card pink"><h3>🎁 獎品設定</h3><div class="note">使用小遊戲館共用獎品池；本遊戲不另外建立獎品。</div></div>
<div class="card green"><h3>👥 玩家紀錄</h3><div class="note">遊玩次數、完成結果、得獎紀錄統一交由小遊戲館處理。</div></div>
</div>
<script>
const $=s=>document.querySelector(s);
$('#toggleRules')?.addEventListener('click',()=>{
 const d=$('#ruleDetails'); d.classList.toggle('hidden');
 $('#toggleRules').textContent=d.classList.contains('hidden')?'查看詳細規則':'收起詳細規則';
});
function sync(){
 $('#hostDifficultyBox').classList.toggle('hidden',$('#difficultyMode').value==='player');
 $('#minutesBox').classList.toggle('hidden',$('#timeMode').value==='unlimited');
 $('#targetBox').classList.toggle('hidden',$('#targetMode').value==='unlimited');
}
['#difficultyMode','#timeMode','#targetMode'].forEach(s=>$(s).addEventListener('change',sync));sync();
async function api(url,opt={}){const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'操作失敗');return d}
async function load(){try{const d=await api('/api/game-settings/turtle');const s=d.settings||{};for(const id of ['difficultyMode','difficulty','timeMode','targetMode'])if(s[id]!==undefined)$('#'+id).value=s[id];if(s.minutes!==undefined)$('#minutes').value=s.minutes;if(s.target!==undefined)$('#target').value=s.target;sync()}catch(e){alert('讀取設定失敗：'+e.message)}}
$('#save').onclick=async()=>{const s={difficultyMode:$('#difficultyMode').value,difficulty:$('#difficulty').value,timeMode:$('#timeMode').value,minutes:Math.max(1,+$('#minutes').value||1),targetMode:$('#targetMode').value,target:Math.max(1,+$('#target').value||1)};try{await api('/api/game-settings/turtle',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(s)});alert('✅ 烏龜島設定已儲存')}catch(e){alert('❌ '+e.message)}};load();
</script></body></html>
