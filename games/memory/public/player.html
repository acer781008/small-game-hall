<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="/common-leaderboard.css"><title>翻牌小遊戲</title></head><body class="player-page"><div id="top" class="topbar hidden"><span>🎴 翻牌小遊戲</span><span><b id="timeLabel">剩餘時間</b> <b id="timer">--:--</b></span></div><main class="wrap"><section id="join" class="panel login"><div class="hero"><h1>🎴 翻牌小遊戲</h1><p>找出所有配對，完成挑戰！</p></div><label>活動碼<input id="room" placeholder="請使用主控分享的玩家網址" readonly></label><label>玩家名稱<input id="name" placeholder="請輸入你的名字" autocomplete="off"></label><button id="joinBtn">👤 進入挑戰</button><p id="msg" class="status"></p></section><section id="lobby" class="panel login hidden"><h2>🎮 挑戰設定</h2><p id="rules" class="status"></p><div class="statusgrid"><div><span>已玩局數</span><b id="played">0</b></div><div><span>完成局數</span><b id="success">0</b></div><div><span>最快完成</span><b id="best">—</b></div></div><button id="startBtn" style="margin-top:14px">▶ 開始遊戲</button><p id="playMsg" class="status"></p><p id="note" class="small"></p></section><section id="game" class="hidden"><div id="board" class="board"></div></section><section id="result" class="panel hidden result"></section><section id="hallLeaderboard" class="hall-leaderboard" data-game="memory"></section></main><div id="overlay" class="overlay hidden"></div><script src="/socket.io/socket.io.js"></script><script src="player.js"></script><script src="/common-leaderboard.js"></script></body></html>
