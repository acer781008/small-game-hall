<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻牌設定</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#493e48}h2{margin:0 0 6px}p{color:#7d7079;margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{font-weight:800;display:block}select{width:100%;margin-top:6px;border:1px solid #d9ccd5;border-radius:11px;padding:10px;font:inherit;font-size:16px}button{border:0;border-radius:12px;padding:11px 16px;background:#7659d7;color:#fff;font:inherit;font-weight:900;cursor:pointer}.save{margin-top:16px}.msg{font-weight:900;margin-left:8px}.note{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f6f1ff;color:#70627b;font-weight:750}@media(max-width:620px){.form{grid-template-columns:1fr}}</style></head><body><h2>🎴 翻牌設定</h2><p>活動碼、每位玩家可完成次數、獎品與紀錄已由小遊戲館統一管理。</p><div class="form"><label>題型<select id="type"><option value="farm">種菜素材</option><option value="idiom">成語</option><option value="poem">唐詩</option></select></label><label>盤面大小<select id="boardSize"><option value="4x4">4 × 4</option><option value="6x6">6 × 6</option><option value="8x8">8 × 8</option></select></label><label>單局時間<select id="gameMinutes"><option value="1">1 分鐘</option><option value="2">2 分鐘</option><option value="3">3 分鐘</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="unlimited">不限時間</option></select></label></div><div class="note">⏱️ 有限時顯示「剩餘時間」；不限時間從 00:00 往上計時。</div><button class="save" id="save">💾 儲存翻牌設定</button><span id="msg" class="msg"></span><script>
async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}async function load(){const d=await api('/api/game-settings/memory'),s=d.settings;type.value=s.type;boardSize.value=s.boardSize;gameMinutes.value=s.gameMinutes}save.onclick=async()=>{try{await api('/api/game-settings/memory',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({type:type.value,boardSize:boardSize.value,gameMinutes:gameMinutes.value})});msg.textContent='✅ 已儲存'}catch(e){msg.textContent=e.message}};load();
</script></body></html>
