<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翻牌設定</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#493e48}h2{margin:0 0 6px}p{color:#7d7079;margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-weight:800;display:block}select{width:100%;margin-top:6px;border:1px solid #d9ccd5;border-radius:11px;padding:10px;font:inherit;font-size:16px}button{border:0;border-radius:12px;padding:11px 16px;background:#7659d7;color:#fff;font:inherit;font-weight:900;cursor:pointer}.save{margin-top:16px}.msg{font-weight:900;margin-left:8px}.note{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f6f1ff;color:#70627b;font-weight:750}.checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px}.chip{display:flex;gap:6px;align-items:center;padding:8px 10px;background:#faf8fd;border:1px solid #e7deeb;border-radius:11px}.chip select{width:auto;margin:0;padding:5px}@media(max-width:620px){.form{grid-template-columns:1fr}}</style></head><body><h2>🎴 翻牌設定</h2><p>遊戲時間由主控設定；若開啟玩家自選，玩家只看到你勾選的題型與盤面。</p><div class="form"><label class="full"><input id="selfSelect" type="checkbox"> 允許玩家自選</label><label>主控指定題型<select id="type"><option value="farm">種菜素材</option><option value="idiom">成語</option><option value="poem">唐詩</option></select></label><label>主控指定盤面<select id="boardSize"><option value="4x4">4 × 4</option><option value="6x6">6 × 6</option><option value="8x8">8 × 8</option></select></label><div class="full"><b>玩家可看到的題型</b><div id="typeChecks" class="checks"></div></div><div class="full"><b>玩家可看到的盤面＋C 級別</b><div id="sizeChecks" class="checks"></div></div><label>單局時間<select id="gameMinutes"><option value="3">3 分鐘</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option><option value="unlimited">不限時間</option></select></label></div><div class="note">C 模式預設：4×4 → C1、6×6 → C2、8×8 → C3。有限時顯示「剩餘時間」；不限時間從 00:00 往上計時。</div><button class="save" id="save">💾 儲存翻牌設定</button><span id="msg" class="msg"></span><script>
const TYPES=[['farm','🌱 種菜素材'],['idiom','🀄 成語'],['poem','📜 唐詩']],SIZES=[['4x4','4×4'],['6x6','6×6'],['8x8','8×8']];async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}function draw(s){typeChecks.innerHTML=TYPES.map(([v,n])=>`<label class="chip"><input class="atype" type="checkbox" value="${v}" ${(s.allowedTypes||[]).includes(v)?'checked':''}> ${n}</label>`).join('');sizeChecks.innerHTML=SIZES.map(([v,n])=>`<label class="chip"><input class="asize" type="checkbox" value="${v}" ${(s.allowedBoardSizes||[]).includes(v)?'checked':''}> ${n}<select data-tier="${v}"><option>C1</option><option>C2</option><option>C3</option></select></label>`).join('');SIZES.forEach(([v])=>document.querySelector(`[data-tier="${v}"]`).value=s.tierByBoardSize?.[v]||({'4x4':'C1','6x6':'C2','8x8':'C3'})[v])}async function load(){const d=await api('/api/game-settings/memory'),s=d.settings;selfSelect.checked=!!s.selfSelect;type.value=s.type;boardSize.value=s.boardSize;gameMinutes.value=s.gameMinutes;if(![...gameMinutes.options].some(o=>o.value===s.gameMinutes))gameMinutes.value='5';draw(s)}save.onclick=async()=>{try{const allowedTypes=[...document.querySelectorAll('.atype:checked')].map(x=>x.value),allowedBoardSizes=[...document.querySelectorAll('.asize:checked')].map(x=>x.value);if(!allowedTypes.length||!allowedBoardSizes.length)return alert('題型與盤面至少各開放一項');const tierByBoardSize={};document.querySelectorAll('[data-tier]').forEach(x=>tierByBoardSize[x.dataset.tier]=x.value);await api('/api/game-settings/memory',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({selfSelect:selfSelect.checked,type:type.value,boardSize:boardSize.value,gameMinutes:gameMinutes.value,allowedTypes,allowedBoardSizes,tierByBoardSize})});msg.textContent='✅ 已儲存'}catch(e){msg.textContent=e.message}};load();
</script></body></html>
