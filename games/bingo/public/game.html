<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/games/bingo/style.css?v=22.5"><link rel="stylesheet" href="/common-leaderboard.css"><title>賓果小遊戲</title>
<style>
.player-title h1{font-size:25px!important}.info-row{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}.info-main{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.chip{font-size:12px;font-weight:900;color:#7d5266;background:#fff8fb;border:1px solid #efd4df;border-radius:999px;padding:4px 8px}.score-chip{background:#fff4c8;border-color:#f2d878;color:#7a5a00}.run-card{padding:9px 11px!important}.run-actions{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.run-actions button{width:auto;min-width:160px}.number img{width:min(82px,22vw);height:min(82px,22vw);object-fit:contain;display:block;margin:auto}.current-caption{text-align:center;font-size:11px;color:#88737d;min-height:14px}.board-card{margin-top:4px!important}.farm-tile-image,.mahjong-tile-image{display:block;width:100%;height:100%;object-fit:contain;user-select:none}.picture-cell.hit img{opacity:.36;transform:scale(.94)}.run-status{text-align:center;font-size:18px;font-weight:900;margin:4px 0}.start-big{font-size:18px;padding:10px 24px}.result-modal{position:fixed;inset:0;background:rgba(73,50,61,.48);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}.result-modal.hidden{display:none}.result-box{width:min(420px,100%);background:#fff;border:2px solid #ffd0df;border-radius:22px;padding:22px;text-align:center}.result-big{font-size:22px;font-weight:900;line-height:1.65}.prize-result{margin:14px 0 4px;padding:14px;border-radius:16px;background:#fff5c9;border:2px solid #f0d56d;font-size:20px;font-weight:950;line-height:1.55}.prize-result.hidden{display:none}.leader th,.leader td{white-space:nowrap}.choice-panel{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:7px 0}.choice-panel select{width:auto;min-width:120px;padding:7px 10px;border-radius:10px;border:1px solid #e4cfd9;background:#fff;font-weight:800}.choice-panel.hidden{display:none}.rule-chip{background:#eef8ff;border-color:#cfe6f6;color:#47677c}
@media(max-width:700px){.player-title h1{font-size:20px!important;margin:5px 0!important}.wrap{padding-top:3px!important}.run-card{padding:6px 8px!important;margin-bottom:3px!important}.info-row{gap:3px}.info-main{gap:4px}.chip{font-size:10px;padding:2px 5px}.run-status{font-size:16px;margin:2px 0}.number img{width:min(64px,18vw);height:min(64px,18vw)}.run-actions button{min-width:135px;padding:7px 10px}.board-card{padding-top:4px!important}.rank-card{margin-top:4px!important}}
</style>
</head>
<body class="cute-theme player-page">
<div class="top player-title"><h1>🎱 賓果小遊戲</h1></div>
<div class="wrap">
<div class="card run-card">
<div class="info-row"><div class="info-main"><b>👤 <span id="who"></span>　🏠 <span id="roomText"></span></b><span id="goalText" class="chip">🏆 任意 1 線 Bingo</span><span id="myRecord" class="chip score-chip">✅ 成功 0 局｜🎮 0 局</span></div><button id="voiceBtn" type="button">🔊 聲音</button></div>
<div id="activityStatus" class="run-status">重新連線中…</div>
<div id="currentNumber" class="number">—</div><div id="currentCaption" class="current-caption"></div>
<div class="run-actions"><button id="startRunBtn" class="start-big" disabled>▶ 開始遊戲</button><span id="runInfo" class="chip">尚未開始</span></div>
</div>
<div class="card board-card"><div id="board" class="board"></div></div>
<section id="hallLeaderboard" class="hall-leaderboard" data-game="bingo"></section>
</div>
<div id="resultModal" class="result-modal hidden"><div class="result-box"><h2>🏁 本局成績</h2><div id="resultSummary" class="result-big"></div><div id="prizeResult" class="prize-result hidden"></div><div class="run-actions"><button id="retryResultBtn">🔄 重新開始</button><button id="hallResultBtn">🏠 返回遊戲廳</button></div></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const saved=JSON.parse(sessionStorage.getItem('bingoPlayer')||localStorage.getItem('bingoPlayer')||'null');if(!saved){alert('請先從玩家加入頁進入房間');location.href='/';throw new Error('no player')}
const socket=io(),$=id=>document.getElementById(id);const who=$('who'),roomText=$('roomText'),goalText=$('goalText'),myRecord=$('myRecord'),voiceBtn=$('voiceBtn'),activityStatus=$('activityStatus'),currentNumber=$('currentNumber'),currentCaption=$('currentCaption'),startRunBtn=$('startRunBtn'),runInfo=$('runInfo'),board=$('board'),rankBody=$('rankBody'),resultModal=$('resultModal'),resultSummary=$('resultSummary');who.textContent=saved.name;roomText.textContent=saved.roomId;
let room={},gameVersion='farm',playMode='normal',gameItems=[],boardNumbers=[],hitNumbers=new Set(),current=null,runId=null,runActive=false,runStartedAt=0,runEndsAt=0,drawTimer=null,timeTimer=null,drawPool=[],lastDrawPos=-1,voiceOn=false,voiceUnlocked=false,gamesPlayed=0,successCount=0,bestCompletionMs=0,missedCount=0;
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function imageVersion(){return gameVersion==='farm'||gameVersion==='picture'}function itemSrc(item,fallback=false){if(gameVersion==='farm'){const name=String(item.file||'');return fallback?`/games/bingo/farm/${name}?v=154`:`/games/bingo/farm-webp/${name.replace(/\.png$/i,'.webp')}?v=154`}return `/games/bingo/mahjong/${item.file}`}function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function poolMax(){return playMode==='normal'?room.size:({25:50,36:60,49:75,64:90}[room.size]||room.size)}function sourcePool(){if(imageVersion())return gameItems.map(x=>x.id);return Array.from({length:poolMax()},(_,i)=>i+1)}
function itemHTML(item){if(!item)return'';const cls=gameVersion==='farm'?'farm-tile-image':'mahjong-tile-image',src=itemSrc(item),fallback=gameVersion==='farm'?itemSrc(item,true):'';return `<img class="${cls}" src="${src}"${fallback?` data-fallback="${fallback}" onerror="if(this.dataset.fallback){const f=this.dataset.fallback;this.dataset.fallback='';this.onerror=null;this.src=f}"`:''} loading="eager" decoding="async" alt="${esc(item.name||item.face||'')}">`}
function attachImageFallback(img){if(!img||!img.dataset.fallback)return;img.addEventListener('error',()=>{const f=img.dataset.fallback;if(!f)return;img.dataset.fallback='';img.onerror=null;img.src=f},{once:true})}
function previewKey(){return `bingoPreview:${saved.roomId}:${saved.clientId}`};function runStateKey(){return `bingoRun:${saved.roomId}:${saved.clientId}`}
function savePreview(){try{localStorage.setItem(previewKey(),JSON.stringify({version:gameVersion,playMode,size:room.size,boardNumbers}))}catch{}}function clearPreview(){try{localStorage.removeItem(previewKey())}catch{}}
function loadPreview(){try{const x=JSON.parse(localStorage.getItem(previewKey())||'null');if(x&&x.version===gameVersion&&x.playMode===playMode&&Number(x.size)===Number(room.size)&&Array.isArray(x.boardNumbers)&&x.boardNumbers.length===Number(room.size)){const allowed=new Set(sourcePool().map(String));if(x.boardNumbers.every(v=>allowed.has(String(v))))return x.boardNumbers}}catch{}return null}
function saveRunState(){if(!runId)return;try{localStorage.setItem(runStateKey(),JSON.stringify({runId,boardNumbers,hitNumbers:[...hitNumbers]}))}catch{}}
function loadRunState(id){try{const x=JSON.parse(localStorage.getItem(runStateKey())||'null');return x&&String(x.runId)===String(id)?x:null}catch{return null}}
function clearRunState(){try{localStorage.removeItem(runStateKey())}catch{}}
function renderBoard(){const side=Math.sqrt(room.size);board.style.gridTemplateColumns=`repeat(${side},minmax(0,1fr))`;board.dataset.side=side;board.innerHTML='';for(const n of boardNumbers){const c=document.createElement('div');c.className='cell'+(imageVersion()?' picture-cell':'')+(hitNumbers.has(String(n))?' hit':'');c.dataset.number=n;if(imageVersion()){const item=gameItems.find(x=>String(x.id)===String(n));c.innerHTML=itemHTML(item);attachImageFallback(c.querySelector('img'))}else c.textContent=n;c.onclick=()=>clickCell(c,n);board.appendChild(c)}}
function stats(){const cells=[...board.children],side=Math.sqrt(room.size),m=cells.map(c=>c.classList.contains('hit'));let lines=0;for(let r=0;r<side;r++)if(Array.from({length:side},(_,c)=>m[r*side+c]).every(Boolean))lines++;for(let c=0;c<side;c++)if(Array.from({length:side},(_,r)=>m[r*side+c]).every(Boolean))lines++;if(Array.from({length:side},(_,i)=>m[i*side+i]).every(Boolean))lines++;if(Array.from({length:side},(_,i)=>m[i*side+side-1-i]).every(Boolean))lines++;return{hitCount:m.filter(Boolean).length,bingoLines:lines}}
function completed(s){return s.bingoLines>=1}function clickCell(cell,n){if(!runActive||String(n)!==String(current)||cell.classList.contains('hit'))return;cell.classList.add('hit');hitNumbers.add(String(n));saveRunState();const st=stats();runInfo.textContent=`✅ ${st.hitCount} 格｜🔗 ${st.bingoLines} 線`;if(completed(st))finishRun(true)}
function clearRunTimers(){clearInterval(drawTimer);clearInterval(timeTimer);drawTimer=timeTimer=null}function fmtSec(sec){const m=Math.floor(sec/60),s=Math.max(0,Math.floor(sec%60));return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function renderCurrent(v){current=v;if(!v){currentNumber.textContent='—';currentCaption.textContent='';return}if(imageVersion()){const item=gameItems.find(x=>String(x.id)===String(v));currentNumber.innerHTML=itemHTML(item);attachImageFallback(currentNumber.querySelector('img'));currentCaption.textContent=gameVersion==='farm'?'':(item?.name||item?.face||'')}else{currentNumber.textContent=v;currentCaption.textContent=''}speak(v)}
function speechText(v){if(gameVersion==='number')return String(v);const item=gameItems.find(x=>String(x.id)===String(v));return item?.name||item?.face||String(v)}function speak(v){if(gameVersion==='farm'||!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speechText(v));u.lang='zh-TW';u.rate=.85;speechSynthesis.speak(u)}function updateVoice(){if(gameVersion==='farm'){voiceBtn.style.display='none';voiceOn=false}else{voiceBtn.style.display='';voiceBtn.textContent=voiceOn?'🔊 聲音：開':'🔇 聲音：關'}}
voiceBtn.onclick=()=>{if(gameVersion==='farm')return;if(!voiceUnlocked){alert('若從 LINE 內開啟可能沒有語音，建議使用 Chrome／Safari。');voiceUnlocked=true}if(!('speechSynthesis'in window))return alert('瀏覽器不支援語音');voiceOn=!voiceOn;updateVoice()};
function syncRun(){if(!runActive||!runId)return;const now=Date.now();if(runEndsAt&&now>=runEndsAt)return finishRun(false);const interval=Math.max(1000,Number(room.drawIntervalMs||4000)),pos=Math.floor(Math.max(0,now-runStartedAt)/interval);if(pos>=drawPool.length)return finishRun(false);if(pos!==lastDrawPos){lastDrawPos=pos;const past=drawPool.slice(0,pos);missedCount=past.filter(v=>boardNumbers.some(n=>String(n)===String(v))&&!hitNumbers.has(String(v))).length;renderCurrent(drawPool[pos]);const st=stats();runInfo.textContent=st.hitCount?`✅ ${st.hitCount} 格｜🔗 ${st.bingoLines} 線`:`漏點 ${missedCount} 格`}if(runEndsAt){const sec=Math.max(0,Math.ceil((runEndsAt-now)/1000));activityStatus.textContent=`🟢 遊戲進行中｜剩餘時間 ${fmtSec(sec)}`}else{activityStatus.textContent=`🟢 遊戲進行中｜遊戲時間 ${fmtSec((now-runStartedAt)/1000)}`}}
function startLocalRun(auth){runId=auth.runId;runStartedAt=Number(auth.startedAt)||Date.now();runEndsAt=auth.endsAt?Number(auth.endsAt):null;if(auth.version){gameVersion=auth.version;playMode=auth.playMode||'normal';room.size=Number(auth.size||room.size);room.version=gameVersion;room.playMode=playMode;if(auth.drawIntervalMs)room.drawIntervalMs=Number(auth.drawIntervalMs);if(auth.items)gameItems=auth.items}boardNumbers=Array.isArray(auth.boardNumbers)&&auth.boardNumbers.length?auth.boardNumbers.slice():boardNumbers;drawPool=Array.isArray(auth.drawPool)?auth.drawPool.slice():shuffle(sourcePool());const savedState=loadRunState(runId);hitNumbers=new Set((savedState?.hitNumbers||[]).map(String));renderBoard();savePreview();saveRunState();lastDrawPos=-1;startRunBtn.disabled=true;runActive=true;activityStatus.textContent=auth.resumed?'🔄 已恢復原本這一局':'🟢 遊戲進行中';clearRunTimers();syncRun();drawTimer=setInterval(syncRun,250);timeTimer=setInterval(syncRun,500)}
function finishRun(wasCompleted){if(!runActive||!runId)return;runActive=false;clearRunTimers();const st=stats(),id=runId;renderCurrent(null);activityStatus.textContent='⏳ 正在儲存本局成績…';socket.emit('submitRun',{runId:id,hitCount:st.hitCount,bingoLines:st.bingoLines,completed:wasCompleted,durationMs:Math.max(0,Date.now()-runStartedAt),missedCount})}
startRunBtn.onclick=()=>{if(runActive||runId)return;if(!boardNumbers.length){boardNumbers=shuffle(sourcePool()).slice(0,room.size);renderBoard();savePreview()}socket.emit('beginRun',{boardNumbers});startRunBtn.disabled=true;activityStatus.textContent='準備開始…'};
function fmtMs(ms){if(!ms)return '—';const sec=Math.floor(ms/1000),m=Math.floor(sec/60),s=sec%60,cs=Math.floor(ms%1000/10);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`}function renderRank(){}
function applyRoom(data){room={...room,...data};gameVersion=room.version||'farm';playMode=room.playMode||'normal';gameItems=room.items||[];goalText.textContent='🏆 任意 1 線 Bingo';updateVoice();if(!runActive&&!runId){startRunBtn.disabled=false;activityStatus.textContent='🟢 可開始遊戲'}if(!boardNumbers.length){boardNumbers=loadPreview()||shuffle(sourcePool()).slice(0,room.size);hitNumbers=new Set();renderBoard();savePreview()}}
function showResult(d){$('prizeResult').classList.add('hidden');resultSummary.innerHTML=`${d.completed?'✅ 已完成本局條件':'⏰ 本局未完成'}${d.completed?`<br>完成時間：${fmtMs(d.completionMs)}`:''}<br>🎮 已玩：${d.gamesPlayed} 局｜成功 ${d.successCount||0} 局${d.bestCompletionMs?`<br>⚡ 最快完成：${fmtMs(d.bestCompletionMs)}`:''}`;$('retryResultBtn').style.display=d.completed?'none':'';resultModal.classList.remove('hidden')}
function showPrize(a){const el=$('prizeResult');if(!a){el.classList.add('hidden');return;}if(a.status==='game_out_of_stock')el.innerHTML='🎁 此遊戲目前的獎品已兌換完畢';else if(a.status==='out_of_stock')el.innerHTML='🎁 獎品已全數發放完畢';else if(a.status==='limit_reached')el.innerHTML='🎁 已達每位玩家可領獎次數上限';else if(a.status==='activity_closed')el.innerHTML='🏁 活動已結束，本局不再發獎';else if(a.status==='storage_error')el.innerHTML='⚠️ 獎品資料保存失敗，請洽主控';else el.innerHTML=`🎉 恭喜獲獎<br><strong>${a.prizeName||'獎品'}</strong><br><small>已領 ${a.prizeClaimCount||1} 次</small>`;el.classList.remove('hidden');resultModal.classList.remove('hidden')}
$('retryResultBtn').onclick=()=>{resultModal.classList.add('hidden');clearRunState();clearPreview();boardNumbers=[];hitNumbers=new Set();runInfo.textContent='尚未開始';applyRoom(room);startRunBtn.click()};$('hallResultBtn').onclick=()=>{location.href='/?activity='+encodeURIComponent(saved.roomId)};
socket.on('joinError',m=>{alert('❌ '+m);location.href='/'});socket.on('joinSuccess',data=>{gamesPlayed=data.gamesPlayed||0;successCount=data.successCount||0;bestCompletionMs=data.bestCompletionMs||0;myRecord.textContent=`✅ 成功 ${successCount} 局｜🎮 ${gamesPlayed} 局`;applyRoom(data);if(data.activeRun)startLocalRun({...data.activeRun,resumed:true})});socket.on('runAuthorized',startLocalRun);socket.on('runDenied',m=>{runId=null;runActive=false;startRunBtn.disabled=false;activityStatus.textContent='🟢 可開始遊戲';alert('❌ '+m)});socket.on('runSaved',d=>{clearRunState();clearPreview();runId=null;boardNumbers=[];hitNumbers=new Set();gamesPlayed=d.gamesPlayed;successCount=d.successCount||0;bestCompletionMs=d.bestCompletionMs||0;myRecord.textContent=`✅ 成功 ${successCount} 局｜🎮 ${gamesPlayed} 局`;const cs=d.completionStatus||{},reached=cs.max>0&&cs.completions>=cs.max;activityStatus.textContent=reached?'✅ 已達每位玩家可完成次數上限':'🟢 本局結束，可再開始';startRunBtn.disabled=reached;runInfo.textContent=d.completed?`✅ 完成｜${fmtMs(d.completionMs)}`:'本局未完成';showResult(d);window.refreshHallLeaderboard?.()});socket.on('prizeResult',showPrize);socket.on('rankingUpdate',renderRank);socket.on('roomDeleted',()=>{alert('活動已刪除');localStorage.removeItem('bingoPlayer');sessionStorage.removeItem('bingoPlayer');location.href='/'});socket.on('connect',()=>socket.emit('joinRoom',{roomId:saved.roomId,name:saved.name,clientId:saved.clientId}));
</script><script src="/common-leaderboard.js"></script>
</body></html>
