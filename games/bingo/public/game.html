<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/games/bingo/style.css?v=22.5"><title>賓果小遊戲</title>
<style>
.player-title h1{font-size:25px!important}.info-row{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap}.info-main{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.chip{font-size:12px;font-weight:900;color:#7d5266;background:#fff8fb;border:1px solid #efd4df;border-radius:999px;padding:4px 8px}.score-chip{background:#fff4c8;border-color:#f2d878;color:#7a5a00}.run-card{padding:9px 11px!important}.run-actions{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}.run-actions button{width:auto;min-width:160px}.number img{width:min(82px,22vw);height:min(82px,22vw);object-fit:contain;display:block;margin:auto}.current-caption{text-align:center;font-size:11px;color:#88737d;min-height:14px}.board-card{margin-top:4px!important}.farm-tile-image,.mahjong-tile-image{display:block;width:100%;height:100%;object-fit:contain;user-select:none}.picture-cell.hit img{opacity:.36;transform:scale(.94)}.run-status{text-align:center;font-size:18px;font-weight:900;margin:4px 0}.start-big{font-size:18px;padding:10px 24px}.result-modal{position:fixed;inset:0;background:rgba(73,50,61,.48);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000}.result-modal.hidden{display:none}.result-box{width:min(420px,100%);background:#fff;border:2px solid #ffd0df;border-radius:22px;padding:22px;text-align:center}.result-big{font-size:22px;font-weight:900;line-height:1.65}.prize-result{margin:14px 0 4px;padding:14px;border-radius:16px;background:#fff5c9;border:2px solid #f0d56d;font-size:20px;font-weight:950;line-height:1.55}.prize-result.hidden{display:none}.leader th,.leader td{white-space:nowrap}.choice-panel{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:7px 0}.choice-panel select{width:auto;min-width:120px;padding:7px 10px;border-radius:10px;border:1px solid #e4cfd9;background:#fff;font-weight:800}.choice-panel.hidden{display:none}.rule-chip{background:#eef8ff;border-color:#cfe6f6;color:#47677c}
@media(max-width:700px){.player-title h1{font-size:20px!important;margin:5px 0!important}.wrap{padding-top:3px!important}.run-card{padding:6px 8px!important;margin-bottom:3px!important}.info-row{gap:3px}.info-main{gap:4px}.chip{font-size:10px;padding:2px 5px}.run-status{font-size:16px;margin:2px 0}.number img{width:min(64px,18vw);height:min(64px,18vw)}.run-actions button{min-width:135px;padding:7px 10px}.board-card{padding-top:4px!important}.rank-card{margin-top:4px!important}}
</style>
</head>
<body class="cute-theme player-page">
<div class="top player-title"><h1>🎱 賓果小遊戲</h1></div>
<div class="wrap">
<div class="card run-card">
<div class="info-row"><div class="info-main"><b>👤 <span id="who"></span>　🏠 <span id="roomText"></span></b><span id="goalText" class="chip">🏆 任意 1 線 Bingo</span><span id="myRecord" class="chip score-chip">✅ 成功 0 局｜🎮 0 局</span></div><button id="voiceBtn" type="button">🔊 聲音</button></div>
<div id="activityStatus" class="run-status">重新連線中…</div>
<div id="currentNumber" class="number">—</div><div id="currentCaption" class="current-caption"></div>
<div class="run-actions"><button id="startRunBtn" class="start-big" disabled>▶ 開始遊戲</button><span id="runInfo" class="chip">尚未開始</span></div>
</div>
<div class="card board-card"><div id="board" class="board"></div></div>
<div class="card rank-card"><h2>🏆 排行榜</h2><table class="leader"><thead><tr><th>排名</th><th>玩家</th><th>成功</th><th>最快</th><th>局數</th></tr></thead><tbody id="rankBody"></tbody></table></div>
</div>
<div id="resultModal" class="result-modal hidden"><div class="result-box"><h2>🏁 本局成績</h2><div id="resultSummary" class="result-big"></div><div id="prizeResult" class="prize-result hidden"></div><button id="closeResultBtn">知道了</button></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const saved=JSON.parse(sessionStorage.getItem('bingoPlayer')||localStorage.getItem('bingoPlayer')||'null');if(!saved){alert('請先從玩家加入頁進入房間');location.href='/';throw new Error('no player')}
const socket=io(),$=id=>document.getElementById(id);const who=$('who'),roomText=$('roomText'),goalText=$('goalText'),myRecord=$('myRecord'),voiceBtn=$('voiceBtn'),activityStatus=$('activityStatus'),currentNumber=$('currentNumber'),currentCaption=$('currentCaption'),startRunBtn=$('startRunBtn'),runInfo=$('runInfo'),board=$('board'),rankBody=$('rankBody'),resultModal=$('resultModal'),resultSummary=$('resultSummary');who.textContent=saved.name;roomText.textContent=saved.roomId;
let room={},gameVersion='farm',playMode='normal',gameItems=[],boardNumbers=[],hitNumbers=new Set(),current=null,runId=null,runActive=false,runStartedAt=0,drawTimer=null,timeTimer=null,drawPool=[],drawIndex=0,voiceOn=false,voiceUnlocked=false,gamesPlayed=0,successCount=0,bestCompletionMs=0,missedCount=0;
const imageLoadQueue=[];let activeImageLoads=0;const MAX_IMAGE_LOADS=4;function loadImage(img,src,attempt=0){return new Promise(resolve=>{img.onload=()=>resolve(true);img.onerror=()=>attempt<2?setTimeout(()=>loadImage(img,src,attempt+1).then(resolve),300*(attempt+1)):resolve(false);img.src=src})}function pump(){while(activeImageLoads<MAX_IMAGE_LOADS&&imageLoadQueue.length){const j=imageLoadQueue.shift();activeImageLoads++;loadImage(j.img,j.src).finally(()=>{activeImageLoads--;pump()})}}function queueImage(img,src,priority=false){if(!img||!src)return;(priority?imageLoadQueue.unshift({img,src}):imageLoadQueue.push({img,src}));pump()}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function imageVersion(){return gameVersion==='farm'||gameVersion==='picture'}function itemSrc(item){return gameVersion==='farm'?`/farm/${item.file}`:`/mahjong/${item.file}`}function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function poolMax(){return playMode==='normal'?room.size:({25:50,36:60,49:75,64:90}[room.size]||room.size)}function sourcePool(){if(imageVersion())return gameItems.map(x=>x.id);return Array.from({length:poolMax()},(_,i)=>i+1)}
function itemHTML(item,defer=true){if(!item)return'';const cls=gameVersion==='farm'?'farm-tile-image':'mahjong-tile-image',src=itemSrc(item);return defer?`<img class="${cls}" data-src="${src}" alt="${esc(item.name||item.face||'')}">`:`<img class="${cls}" src="${src}" alt="${esc(item.name||item.face||'')}">`}
function renderBoard(){const side=Math.sqrt(room.size);board.style.gridTemplateColumns=`repeat(${side},minmax(0,1fr))`;board.dataset.side=side;board.innerHTML='';for(const n of boardNumbers){const c=document.createElement('div');c.className='cell'+(imageVersion()?' picture-cell':'');c.dataset.number=n;if(imageVersion()){const item=gameItems.find(x=>String(x.id)===String(n));c.innerHTML=itemHTML(item,true);const img=c.querySelector('img');if(img)queueImage(img,img.dataset.src)}else c.textContent=n;c.onclick=()=>clickCell(c,n);if(imageVersion())c.onclick=()=>clickCell(c,n);board.appendChild(c)}}
function stats(){const cells=[...board.children],side=Math.sqrt(room.size),m=cells.map(c=>c.classList.contains('hit'));let lines=0;for(let r=0;r<side;r++)if(Array.from({length:side},(_,c)=>m[r*side+c]).every(Boolean))lines++;for(let c=0;c<side;c++)if(Array.from({length:side},(_,r)=>m[r*side+c]).every(Boolean))lines++;if(Array.from({length:side},(_,i)=>m[i*side+i]).every(Boolean))lines++;if(Array.from({length:side},(_,i)=>m[i*side+side-1-i]).every(Boolean))lines++;return{hitCount:m.filter(Boolean).length,bingoLines:lines}}
function completed(s){return s.bingoLines>=1}function clickCell(cell,n){if(!runActive||String(n)!==String(current)||cell.classList.contains('hit'))return;cell.classList.add('hit');hitNumbers.add(String(n));const s=stats();runInfo.textContent=`✅ ${s.hitCount} 格｜🔗 ${s.bingoLines} 線`;if(completed(s))finishRun(true)}
function clearRunTimers(){clearInterval(drawTimer);clearInterval(timeTimer);drawTimer=timeTimer=null}function fmtSec(sec){const m=Math.floor(sec/60),s=Math.max(0,Math.floor(sec%60));return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function renderCurrent(v){current=v;if(!v){currentNumber.textContent='—';currentCaption.textContent='';return}if(imageVersion()){const item=gameItems.find(x=>String(x.id)===String(v));currentNumber.innerHTML=itemHTML(item,true);const img=currentNumber.querySelector('img');if(img)queueImage(img,img.dataset.src,true);currentCaption.textContent=gameVersion==='farm'?'':(item?.name||item?.face||'')}else{currentNumber.textContent=v;currentCaption.textContent=''}speak(v)}
function speechText(v){if(gameVersion==='number')return String(v);const item=gameItems.find(x=>String(x.id)===String(v));return item?.name||item?.face||String(v)}function speak(v){if(gameVersion==='farm'||!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speechText(v));u.lang='zh-TW';u.rate=.85;speechSynthesis.speak(u)}function updateVoice(){if(gameVersion==='farm'){voiceBtn.style.display='none';voiceOn=false}else{voiceBtn.style.display='';voiceBtn.textContent=voiceOn?'🔊 聲音：開':'🔇 聲音：關'}}
voiceBtn.onclick=()=>{if(gameVersion==='farm')return;if(!voiceUnlocked){alert('若從 LINE 內開啟可能沒有語音，建議使用 Chrome／Safari。');voiceUnlocked=true}if(!('speechSynthesis'in window))return alert('瀏覽器不支援語音');voiceOn=!voiceOn;updateVoice()};
function prepareRun(){hitNumbers=new Set();missedCount=0;const pool=sourcePool();boardNumbers=playMode==='normal'?shuffle(pool).slice(0,room.size):shuffle(pool).slice(0,room.size);drawPool=shuffle(pool);drawIndex=0;renderBoard();renderCurrent(null);runInfo.textContent='準備中'}
function markMissedCurrent(){if(current==null)return;const onBoard=boardNumbers.some(n=>String(n)===String(current));if(onBoard&&!hitNumbers.has(String(current)))missedCount++}function nextDraw(){if(!runActive)return;if(current!=null)markMissedCurrent();if(drawIndex>=drawPool.length)return finishRun(false);renderCurrent(drawPool[drawIndex++]);runInfo.textContent=`漏點 ${missedCount} 格`}
function startLocalRun(auth){runId=auth.runId;runStartedAt=auth.startedAt||Date.now();if(auth.version){gameVersion=auth.version;playMode=auth.playMode||'normal';gameItems=auth.items||[];room.size=Number(auth.size||room.size);room.version=gameVersion;room.playMode=playMode;}prepareRun();startRunBtn.disabled=true;runActive=true;activityStatus.textContent='🟢 遊戲進行中';nextDraw();drawTimer=setInterval(nextDraw,Number(room.drawIntervalMs||4000));if(room.timeLimitEnabled!==false){const end=Date.now()+Number(room.gameSeconds||90)*1000;const tick=()=>{const sec=Math.max(0,Math.ceil((end-Date.now())/1000));activityStatus.textContent=`🟢 遊戲進行中｜剩餘 ${fmtSec(sec)}`;if(sec<=0)finishRun(false)};tick();timeTimer=setInterval(tick,500)}}
function finishRun(wasCompleted){if(!runActive&&runId===null)return;runActive=false;clearRunTimers();const s=stats(),id=runId;runId=null;renderCurrent(null);activityStatus.textContent='⏳ 正在儲存本局成績…';socket.emit('submitRun',{runId:id,hitCount:s.hitCount,bingoLines:s.bingoLines,completed:wasCompleted,durationMs:Math.max(0,Date.now()-runStartedAt),missedCount})}
startRunBtn.onclick=()=>{if(runActive||runId)return;socket.emit('beginRun');startRunBtn.disabled=true;activityStatus.textContent='準備開始…'};
function fmtMs(ms){if(!ms)return '—';return (ms/1000).toFixed(1)+' 秒'}function renderRank(list){rankBody.innerHTML=(list||[]).map(p=>`<tr><td>${p.rank<4?['🥇','🥈','🥉'][p.rank-1]:p.rank}</td><td>${esc(p.name)}</td><td><b>${p.successCount||0}</b></td><td>${fmtMs(p.bestCompletionMs)}</td><td>${p.gamesPlayed}</td></tr>`).join('')}
function applyRoom(data){room={...room,...data};gameVersion=room.version||'farm';playMode=room.playMode||'normal';gameItems=room.items||[];goalText.textContent='🏆 任意 1 線 Bingo';updateVoice();if(!runActive&&!runId){const limit=Number(room.maxPlays||0);const left=limit?Math.max(0,limit-gamesPlayed):null;startRunBtn.disabled=limit>0&&gamesPlayed>=limit;activityStatus.textContent=limit?`🟢 可開始遊戲｜剩餘 ${left} 次`:'🟢 可開始遊戲'}if(!boardNumbers.length){boardNumbers=shuffle(sourcePool()).slice(0,room.size);renderBoard()}}
function showResult(d){$('prizeResult').classList.add('hidden');resultSummary.innerHTML=`${d.completed?'✅ 已完成本局條件':'⏰ 本局未完成'}${d.completed?`<br>完成時間：${fmtMs(d.completionMs)}`:''}<br>🎮 已玩：${d.gamesPlayed} 局｜成功 ${d.successCount||0} 局${d.bestCompletionMs?`<br>⚡ 最快完成：${fmtMs(d.bestCompletionMs)}`:''}`;resultModal.classList.remove('hidden')}
function showPrize(a){const el=$('prizeResult');if(!a){el.classList.add('hidden');return;}if(a.status==='out_of_stock')el.innerHTML='🎁 此獎品已兌換完畢';else if(a.status==='limit_reached')el.innerHTML='🎁 已達每位玩家可領獎次數上限';else if(a.status==='activity_closed')el.innerHTML='🏁 活動已結束，本局不再發獎';else el.innerHTML=`🎉 恭喜獲獎<br><strong>${a.prizeName||'獎品'}</strong>${a.prizeNote?`<br><small>${a.prizeNote}</small>`:''}<br><small>已領 ${a.prizeClaimCount||1} 次</small>`;el.classList.remove('hidden');resultModal.classList.remove('hidden')}
$('closeResultBtn').onclick=()=>resultModal.classList.add('hidden');
socket.on('joinError',m=>{alert('❌ '+m);location.href='/'});socket.on('joinSuccess',data=>{gamesPlayed=data.gamesPlayed||0;successCount=data.successCount||0;bestCompletionMs=data.bestCompletionMs||0;myRecord.textContent=`✅ 成功 ${successCount} 局｜🎮 ${gamesPlayed} 局`;applyRoom(data)});socket.on('runAuthorized',startLocalRun);socket.on('runDenied',m=>{runId=null;runActive=false;const limit=Number(room.maxPlays||0);startRunBtn.disabled=limit>0&&gamesPlayed>=limit;activityStatus.textContent='🟢 可開始遊戲';alert('❌ '+m)});socket.on('runSaved',d=>{gamesPlayed=d.gamesPlayed;successCount=d.successCount||0;bestCompletionMs=d.bestCompletionMs||0;myRecord.textContent=`✅ 成功 ${successCount} 局｜🎮 ${gamesPlayed} 局`;const limit=Number(room.maxPlays||0);const reached=limit>0&&gamesPlayed>=limit;activityStatus.textContent=reached?'✅ 已達可玩次數上限':(limit?`🟢 本局結束｜剩餘 ${Math.max(0,limit-gamesPlayed)} 次`:'🟢 本局結束，可再開始');startRunBtn.disabled=reached;runInfo.textContent=d.completed?`✅ 完成｜${fmtMs(d.completionMs)}`:'本局未完成';showResult(d)});socket.on('prizeResult',showPrize);socket.on('rankingUpdate',renderRank);socket.on('roomDeleted',()=>{alert('活動已刪除');localStorage.removeItem('bingoPlayer');sessionStorage.removeItem('bingoPlayer');location.href='/'});socket.on('connect',()=>socket.emit('joinRoom',{roomId:saved.roomId,name:saved.name,clientId:saved.clientId}));
</script>
</body></html>
