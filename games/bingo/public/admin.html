<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>賓果設定</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#493e48}h2{margin:0 0 6px}p{color:#7d7079}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-weight:800;display:block}select,input{width:100%;margin-top:6px;border:1px solid #d9ccd5;border-radius:11px;padding:10px;font:inherit;font-size:16px}input[type=checkbox]{width:auto;margin:0}.checks{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.chip{display:flex;align-items:center;gap:6px;background:#fff5e9;border-radius:10px;padding:8px 10px}.tier{width:auto;margin:0;padding:5px}button{border:0;border-radius:12px;padding:11px 16px;background:#7659d7;color:#fff;font:inherit;font-weight:900}.save{margin-top:16px}.msg{font-weight:900;margin-left:8px}.note{margin-top:12px;padding:10px;background:#f6f1ff;border-radius:12px}@media(max-width:620px){.form{grid-template-columns:1fr}}</style></head><body><h2>🎱 賓果設定</h2><p>玩家只看到主控開放的素材、盤面與玩法；遊戲時間由主控統一設定。</p><div class="form"><label class="full chip"><input id="selfSelect" type="checkbox"> 允許玩家自選</label><label>主控指定素材<select id="version"><option value="farm">種菜圖片</option><option value="number">數字</option><option value="picture">麻將圖片</option></select></label><label>主控指定盤面<select id="size"><option value="25">5 × 5</option><option value="36">6 × 6</option><option value="49">7 × 7</option><option value="64">8 × 8</option></select></label><label>主控指定玩法<select id="playMode"><option value="normal">一般模式</option><option value="advanced">進階模式</option></select></label><label>遊戲時間<select id="gameMinutes"><option value="0">不限時間</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option></select></label><label>叫號間隔<select id="drawIntervalMs"><option value="3000">3 秒</option><option value="4000">4 秒</option><option value="5000">5 秒</option></select></label><div class="full"><b>開放素材</b><div class="checks" id="versions"></div></div><div class="full"><b>開放盤面＋C獎級別</b><div class="checks" id="sizes"></div></div><div class="full"><b>開放玩法</b><div class="checks" id="modes"></div></div></div><div class="note">🀄 麻將圖片已補回玩家自選。麻將圖片目前只支援 5×5、6×6。</div><button class="save" id="save">💾 儲存賓果設定</button><span id="msg" class="msg"></span><script>
const vmap={farm:'種菜圖片',number:'數字',picture:'麻將圖片'},smap={25:'5×5',36:'6×6',49:'7×7',64:'8×8'},mmap={normal:'一般模式',advanced:'進階模式'};let s;async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}function draw(){versions.innerHTML=Object.entries(vmap).map(([k,n])=>`<label class="chip"><input type="checkbox" data-v="${k}" ${(s.allowedVersions||[]).includes(k)?'checked':''}> ${n}</label>`).join('');sizes.innerHTML=Object.entries(smap).map(([k,n])=>`<label class="chip"><input type="checkbox" data-s="${k}" ${(s.allowedSizes||[]).includes(+k)?'checked':''}> ${n}<select class="tier" data-tier="${k}"><option ${s.tierBySize?.[k]==='C1'?'selected':''}>C1</option><option ${s.tierBySize?.[k]==='C2'?'selected':''}>C2</option><option ${s.tierBySize?.[k]==='C3'?'selected':''}>C3</option></select></label>`).join('');modes.innerHTML=Object.entries(mmap).map(([k,n])=>`<label class="chip"><input type="checkbox" data-m="${k}" ${(s.allowedPlayModes||[]).includes(k)?'checked':''}> ${n}</label>`).join('')}async function load(){const d=await api('/api/game-settings/bingo');s=d.settings;selfSelect.checked=!!s.selfSelect;version.value=s.version;size.value=String(s.size);playMode.value=s.playMode;gameMinutes.value=String(s.gameMinutes??((s.gameSeconds||0)/60));drawIntervalMs.value=String(s.drawIntervalMs||4000);draw()}save.onclick=async()=>{try{const allowedVersions=[...document.querySelectorAll('[data-v]:checked')].map(x=>x.dataset.v),allowedSizes=[...document.querySelectorAll('[data-s]:checked')].map(x=>+x.dataset.s),allowedPlayModes=[...document.querySelectorAll('[data-m]:checked')].map(x=>x.dataset.m),tierBySize={};Object.keys(smap).forEach(k=>tierBySize[k]=document.querySelector(`[data-tier="${k}"]`).value);await api('/api/game-settings/bingo',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({selfSelect:selfSelect.checked,version:version.value,size:+size.value,playMode:playMode.value,gameMinutes:+gameMinutes.value,drawIntervalMs:+drawIntervalMs.value,allowedVersions,allowedSizes,allowedPlayModes,tierBySize})});msg.textContent='✅ 已儲存';load()}catch(e){msg.textContent=e.message}};load();</script></body></html>
