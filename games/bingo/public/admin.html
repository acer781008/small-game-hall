<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>賓果設定</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#493e48}h2{margin:0 0 6px}p{color:#7d7079;margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-weight:800;display:block}select,input{width:100%;margin-top:6px;border:1px solid #d9ccd5;border-radius:11px;padding:10px;font:inherit;font-size:16px}button{border:0;border-radius:12px;padding:11px 16px;background:#7659d7;color:#fff;font:inherit;font-weight:900;cursor:pointer}.save{margin-top:16px}.msg{font-weight:900;margin-left:8px}.checks{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.checks input{width:auto;margin:0}@media(max-width:620px){.form{grid-template-columns:1fr}}</style></head><body><h2>🎱 賓果設定</h2><p>活動碼、備註與獎品已由小遊戲館統一管理。</p><div class="form"><label>素材版本<select id="version"><option value="farm">種菜圖片</option><option value="number">數字</option><option value="picture">麻將圖片</option></select></label><label>盤面大小<select id="size"><option value="25">5 × 5</option><option value="36">6 × 6</option><option value="49">7 × 7</option><option value="64">8 × 8</option></select></label><label>玩法<select id="playMode"><option value="normal">一般模式</option><option value="advanced">進階模式</option></select></label><label>單局時間<select id="gameSeconds"><option value="30">30 秒</option><option value="60">60 秒</option><option value="90">90 秒</option><option value="120">120 秒</option><option value="180">180 秒</option><option value="300">300 秒</option></select></label><label>每位玩家可完成次數<select id="maxPlays"><option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option><option value="5">5 次</option><option value="0">不限次數</option></select></label><label>叫號間隔<select id="drawIntervalMs"><option value="2000">2 秒</option><option value="3000">3 秒</option><option value="4000">4 秒</option><option value="5000">5 秒</option></select></label></div><button class="save" id="save">💾 儲存賓果設定</button><span id="msg" class="msg"></span><script>
async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}async function load(){const d=await api('/api/game-settings/bingo'),s=d.settings;version.value=s.version;size.value=String(s.size);playMode.value=s.playMode;gameSeconds.value=String(s.gameSeconds);maxPlays.value=String(s.maxPlays||0);drawIntervalMs.value=String(s.drawIntervalMs||4000)}save.onclick=async()=>{try{await api('/api/game-settings/bingo',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({version:version.value,size:+size.value,playMode:playMode.value,gameSeconds:+gameSeconds.value,maxPlays:+maxPlays.value,drawIntervalMs:+drawIntervalMs.value})});msg.textContent='✅ 已儲存'}catch(e){msg.textContent=e.message}};load();</script></body></html>
