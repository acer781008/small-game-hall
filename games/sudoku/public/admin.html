<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數獨設定</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#493e48}h2{margin:0 0 6px}p{color:#7d7079}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-weight:800;display:block}select,input{width:100%;margin-top:6px;border:1px solid #d9ccd5;border-radius:11px;padding:10px;font:inherit;font-size:16px}input[type=checkbox]{width:auto;margin:0}.checks{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.chip{display:flex;align-items:center;gap:6px;background:#f5f3fb;border-radius:10px;padding:8px 10px}.tier{width:auto;margin:0;padding:5px}button{border:0;border-radius:12px;padding:11px 16px;background:#7659d7;color:#fff;font:inherit;font-weight:900;cursor:pointer}.save{margin-top:16px}.msg{font-weight:900;margin-left:8px}@media(max-width:620px){.form{grid-template-columns:1fr}}</style></head><body><h2>🧠 數獨設定</h2><p>玩家只選主控開放的玩法、盤面、難度；遊戲時間由主控設定。</p><div class="form"><label class="full chip"><input id="selfSelect" type="checkbox"> 允許玩家自選</label><label>主控指定玩法<select id="variant"><option>標準數獨</option><option>對角線數獨</option><option>殺手數獨</option><option>不連續數獨</option><option>不規則數獨</option><option>彩色數獨</option></select></label><label>主控指定盤面<select id="size"><option value="9">9 × 9</option><option value="12">12 × 12</option></select></label><label>主控指定難度<select id="difficulty"><option>初級</option><option>中級</option><option>高級</option></select></label><label>遊戲時間<select id="roundMinutes"><option value="0">不限時間</option><option value="3">3 分鐘</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option><option value="45">45 分鐘</option><option value="60">60 分鐘</option></select></label><div class="full"><b>開放玩法</b><div id="variants" class="checks"></div></div><div class="full"><b>開放盤面</b><div id="sizes" class="checks"></div></div><div class="full"><b>開放難度＋C獎級別</b><div id="diffs" class="checks"></div></div><label class="full chip"><input id="showWrongCount" type="checkbox"> 顯示錯誤格數</label></div><button class="save" id="save">💾 儲存數獨設定</button><span id="msg" class="msg"></span><script>
const allV=['標準數獨','對角線數獨','殺手數獨','不連續數獨','不規則數獨','彩色數獨'],allD=['初級','中級','高級'];let s;async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}function draw(){variants.innerHTML=allV.map(v=>`<label class="chip"><input type="checkbox" data-v="${v}" ${(s.allowedVariants||[]).includes(v)?'checked':''}> ${v}</label>`).join('');sizes.innerHTML=[9,12].map(v=>`<label class="chip"><input type="checkbox" data-s="${v}" ${(s.allowedSizes||[]).includes(v)?'checked':''}> ${v}×${v}</label>`).join('');diffs.innerHTML=allD.map(d=>`<label class="chip"><input type="checkbox" data-d="${d}" ${(s.allowedDifficulties||[]).includes(d)?'checked':''}> ${d}<select class="tier" data-tier="${d}"><option ${s.tierByDifficulty?.[d]==='C1'?'selected':''}>C1</option><option ${s.tierByDifficulty?.[d]==='C2'?'selected':''}>C2</option><option ${s.tierByDifficulty?.[d]==='C3'?'selected':''}>C3</option></select></label>`).join('')}async function load(){const d=await api('/api/game-settings/sudoku');s=d.settings;selfSelect.checked=!!s.selfSelect;variant.value=s.variant;size.value=String(s.size);difficulty.value=s.difficulty;roundMinutes.value=String(s.roundMinutes);showWrongCount.checked=!!s.showWrongCount;draw()}save.onclick=async()=>{try{const allowedVariants=[...document.querySelectorAll('[data-v]:checked')].map(x=>x.dataset.v),allowedSizes=[...document.querySelectorAll('[data-s]:checked')].map(x=>+x.dataset.s),allowedDifficulties=[...document.querySelectorAll('[data-d]:checked')].map(x=>x.dataset.d),tierByDifficulty={};allD.forEach(d=>tierByDifficulty[d]=document.querySelector(`[data-tier="${d}"]`).value);await api('/api/game-settings/sudoku',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({selfSelect:selfSelect.checked,variant:variant.value,size:+size.value,difficulty:difficulty.value,roundMinutes:+roundMinutes.value,showWrongCount:showWrongCount.checked,allowedVariants,allowedSizes,allowedDifficulties,tierByDifficulty})});msg.textContent='✅ 已儲存';load()}catch(e){msg.textContent=e.message}};load();</script></body></html>
