<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數獨小遊戲｜玩家</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar player-topbar"><div class="brand">🧠 數獨小遊戲</div><button class="btn player-rule-top" id="ruleBtnTop">📖 遊戲規則</button><div class="statusline player-status"><span class="badge">玩家 <b id="nameLabel">—</b></span><span class="badge">完成 <b id="winsLabel">0</b> 次</span></div></header>
<div class="player-shell"><section id="joinCard" class="join-card"><h2>開始遊戲</h2><div class="form-row"><label>玩家名稱</label><input id="joinName" maxlength="20" placeholder="請輸入名稱"></div><button class="btn primary" id="joinBtn" style="width:100%;padding:14px">進入數獨</button><div id="joinMsg" class="tiny" style="margin-top:10px"></div></section>
<section id="gamePanel" class="panel hidden"><div class="points-summary"><b>🎁 時間內完成即可獲獎</b><span id="myWins">完成 0 盤</span></div><div class="tiny" style="text-align:center"><b id="variantLabel"></b>　｜　<b id="difficultyLabel"></b>　｜　<b id="sizeLabel"></b></div><div id="activityNote" class="notice hidden"></div><div id="idleArea" style="text-align:center;margin:16px 0"><button class="btn primary" id="startRound" style="font-size:18px;padding:14px 28px">▶ 自己開始一局</button><div class="tiny" style="margin-top:8px">每位玩家各自開始、各自計時。</div></div><div id="roundArea" class="hidden"><div id="playerComplete" class="complete-banner hidden"></div><div class="timer" id="playerTimer">00:00</div><div id="wrongCountBox" class="notice hidden" style="text-align:center">目前錯誤：<b id="wrongCount">0</b> 格</div><div id="variantHint" class="variant-hint"></div><div class="board-wrap"><div id="playerBoard" class="sudoku"></div></div><div id="playerKeypad" class="keypad"></div><div class="actions" style="justify-content:center;margin-top:10px"><button class="btn gray" id="playerClear">清除</button><button class="btn primary" id="playerSubmit">完成送出</button></div></div><div id="playerMsg" class="notice hidden"></div><div id="resultActions" class="actions hidden" style="justify-content:center;margin-top:12px"><button class="btn primary" id="retryRound">🔄 重新開始</button><button class="btn gray" id="hallBtn">🏠 返回遊戲廳</button></div></section></div>
<div class="modal" id="ruleModal"><div class="modal-card"><h2 id="ruleTitle"></h2><div id="ruleBody" class="rules"></div><div class="actions" style="justify-content:flex-end"><button class="btn primary" onclick="closeRule()">關閉</button></div></div></div>
<script src="/socket.io/socket.io.js"></script><script src="rules.js"></script><script src="game.js"></script><script src="player.js"></script></body></html>
