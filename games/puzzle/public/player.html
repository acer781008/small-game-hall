<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff3f8"><title>拼圖挑戰</title><link rel="stylesheet" href="/common-leaderboard.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#fff3f8,#eef7ff);color:#40374a;min-height:100vh}.wrap{max-width:620px;margin:auto;padding:16px}.card{background:#ffffffee;border-radius:24px;padding:16px;box-shadow:0 8px 30px #8d789020}.title{text-align:center;font-size:27px;font-weight:950;margin:4px}.sub{text-align:center;color:#766c7c;font-size:14px;margin-bottom:14px}.entry input{width:100%;padding:13px;border:2px solid #e5ddea;border-radius:14px;font-size:16px;margin-bottom:10px}.images{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pick{position:relative;border:3px solid transparent;border-radius:18px;overflow:hidden;background:#fff;padding:0;box-shadow:0 5px 16px #8d78901a;cursor:pointer}.pick img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.pick .name{display:block;padding:9px;font-size:14px;font-weight:900;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pick.on{border-color:#ff69a6;box-shadow:0 0 0 3px #ffd5e7}.check{display:none;position:absolute;right:7px;top:7px;background:#ff69a6;color:#fff;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:900}.pick.on .check{display:block}.start{width:100%;border:0;border-radius:16px;padding:14px;font-size:18px;font-weight:900;background:#ff72aa;color:#fff;cursor:pointer}.hidden{display:none!important}.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:10px}.pill{background:#fff;border-radius:15px;padding:8px 5px;font-weight:850;box-shadow:0 3px 12px #88779918;text-align:center;font-size:13px}.pill b{display:block;font-size:17px;margin-top:2px}.board{width:min(92vw,560px);aspect-ratio:1/1;margin:auto;display:grid;gap:2px;background:#fff;padding:3px;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px #7a6b8a30;touch-action:manipulation}.tile{border:0;padding:0;background-repeat:no-repeat;cursor:pointer;position:relative}.tile.sel{outline:4px solid #ff4d9a;outline-offset:-4px;z-index:2}.tile.hint-piece{outline:5px solid #ffb000;outline-offset:-5px;z-index:3}.tile.hint-target{outline:5px dashed #20a86b;outline-offset:-5px;z-index:3}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;border:0;border-radius:14px;padding:12px 8px;font-weight:850;font-size:15px;background:#fff;color:#574c62;cursor:pointer}.actions button:disabled{opacity:.45}.msg{text-align:center;margin-top:9px;font-size:14px;font-weight:800;color:#6b5c73;min-height:20px}.preview,.modal{position:fixed;inset:0;background:#2d2738dd;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.preview img{max-width:92vw;max-height:82vh;border-radius:18px;box-shadow:0 15px 50px #0008}.modal-card{background:#fff;border-radius:24px;padding:24px;text-align:center;max-width:360px;width:100%}.modal-card .big{font-size:52px}.modal-card h2{font-size:28px;margin:3px 0 8px}.modal-card button{width:100%;border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:900;margin-top:8px;cursor:pointer}.primary{background:#ff72aa!important;color:#fff!important}.secondary{background:#f1eafa!important;color:#514758!important}.status{padding:10px;border-radius:12px;background:#f7f2fb;color:#6a5f72;font-weight:750;line-height:1.45}.prize{margin-top:8px;font-weight:900;color:#b45179}@media(min-width:520px){.images{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main class="wrap"><section id="entry" class="card entry"><div class="title">🧩 拼圖挑戰</div><div class="sub">選一張圖片，把拼圖換回正確位置。</div><input id="playerName" maxlength="30" placeholder="請輸入玩家名稱"><div id="summary" class="status">讀取設定中…</div><div id="images" class="images" style="margin-top:12px"></div><button id="startBtn" class="start" style="margin-top:14px">開始拼圖 ✨</button><div id="entryMsg" class="sub" style="margin-top:10px;color:#c94f5c"></div></section>
<section id="game" class="card hidden"><div class="top"><div class="pill">👤 玩家<b id="who">-</b></div><div class="pill"><span id="timeLabel">剩餘時間</span><b id="time">00:00</b></div><div class="pill">難度<b id="level">5×5</b></div></div><div id="board" class="board"></div><div class="actions"><button id="peek">👀 看原圖 3 秒</button><button id="hint">💡 提示（3）</button></div><div id="message" class="msg">點兩塊拼圖交換位置。</div></section>
<section id="hallLeaderboard" class="hall-leaderboard" data-game="puzzle"></section></main>
<div id="preview" class="preview hidden"><img id="previewImg" alt="原圖"></div>
<div id="finishModal" class="modal hidden"><div class="modal-card"><div class="big">🎉</div><h2>完成啦！</h2><p id="finishText">實際完成時間：00:00</p><div id="finishPrize" class="prize"></div><button id="finishHall" class="primary">🏠 返回遊戲廳</button></div></div>
<div id="timeoutModal" class="modal hidden"><div class="modal-card"><div class="big">⏰</div><h2>時間到！</h2><p>這一局還沒有完成。</p><button id="timeoutAgain" class="primary">🔄 重新開始</button><button id="timeoutHall" class="secondary">🏠 返回遊戲廳</button></div></div>
<script src="/games/puzzle/player.js"></script><script src="/common-leaderboard.js"></script></body></html>
