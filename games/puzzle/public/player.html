<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>拼圖挑戰</title><link rel="stylesheet" href="/common-leaderboard.css"><link rel="stylesheet" href="/common-prizes.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#fff3f8,#eef7ff);color:#40374a}.wrap{max-width:620px;margin:auto;padding:14px}.card{background:#ffffffee;border-radius:22px;padding:15px;box-shadow:0 8px 30px #8d789020}.title{text-align:center;font-size:27px;font-weight:950}.sub{text-align:center;color:#766c7c;font-size:14px;margin-bottom:12px}.entry input,.entry select{width:100%;padding:12px;border:2px solid #e5ddea;border-radius:13px;font-size:16px;margin:7px 0;background:#fff}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.start{width:100%;border:0;border-radius:15px;padding:13px;font-size:18px;font-weight:900;background:#ff72aa;color:#fff}.hidden{display:none!important}.top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:9px}.pill{background:#fff;border-radius:14px;padding:7px 4px;font-weight:850;text-align:center;font-size:13px}.pill b{display:block;font-size:16px}.board{width:min(92vw,560px);aspect-ratio:1/1;margin:auto;display:grid;gap:2px;background:#fff;padding:3px;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px #7a6b8a30}.tile{border:0;padding:0;background-repeat:no-repeat}.tile.sel{outline:4px solid #ff4d9a;outline-offset:-4px;z-index:2}.tile.hint-piece{outline:5px solid #ffb000;outline-offset:-5px}.tile.hint-target{outline:5px dashed #20a86b;outline-offset:-5px}.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;border:0;border-radius:13px;padding:11px 8px;font-weight:850}.msg{text-align:center;margin-top:8px;font-weight:800}.preview,.modal{position:fixed;inset:0;background:#2d2738dd;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.preview img{max-width:92vw;max-height:82vh;border-radius:18px}.modal-card{background:#fff;border-radius:22px;padding:22px;text-align:center;max-width:360px;width:100%}.modal-card button{width:100%;border:0;border-radius:13px;padding:12px;font-weight:900;margin-top:8px}.primary{background:#ff72aa;color:#fff}.secondary{background:#f1eafa}.status{padding:9px;border-radius:11px;background:#f7f2fb;font-weight:750}.prize{margin-top:8px;font-weight:900;color:#b45179}@media(max-width:420px){.choice{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section id="entry" class="card entry"><div class="title">🧩 拼圖挑戰</div><div class="sub">只選分類，開始後隨機抽一張拼圖。</div><input id="playerName" maxlength="30" placeholder="請輸入玩家名稱"><div id="summary" class="status">讀取設定中…</div><div id="choiceWrap" class="choice hidden"><label>分類<select id="category"></select></label><label>盤面<select id="grid"></select></label></div><button id="startBtn" class="start">開始拼圖 ✨</button><div id="entryMsg" class="sub" style="margin-top:9px;color:#c94f5c"></div></section><section id="game" class="card hidden"><div class="top"><div class="pill">👤 玩家<b id="who">-</b></div><div class="pill"><span id="timeLabel">剩餘時間</span><b id="time">00:00</b></div><div class="pill">難度<b id="level">5×5</b></div></div><div id="pickedName" class="status" style="text-align:center;margin-bottom:8px"></div><div id="board" class="board"></div><div class="actions"><button id="peek">👀 看原圖 3 秒</button><button id="hint">💡 提示（3）</button></div><div id="message" class="msg">點兩塊拼圖交換位置。</div></section><section id="hallLeaderboard" class="hall-leaderboard" data-game="puzzle"></section></main><div id="preview" class="preview hidden"><img id="previewImg" alt="原圖"></div><div id="finishModal" class="modal hidden"><div class="modal-card"><div style="font-size:48px">🎉</div><h2>完成啦！</h2><p id="finishText"></p><div id="finishPrize" class="prize"></div><button id="finishHall" class="primary">🏠 返回遊戲廳</button></div></div><div id="timeoutModal" class="modal hidden"><div class="modal-card"><div style="font-size:48px">⏰</div><h2>時間到！</h2><button id="timeoutAgain" class="primary">🔄 重新開始</button><button id="timeoutHall" class="secondary">🏠 返回遊戲廳</button></div></div><script src="/common-prizes.js"></script><script src="/games/puzzle/player.js"></script><script src="/common-leaderboard.js"></script></body></html>
