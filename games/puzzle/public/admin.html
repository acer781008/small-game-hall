<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼圖挑戰｜主控</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#fff4f8,#eef6ff);color:#40374a}.wrap{max-width:980px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.title{font-size:28px;font-weight:900}.badge{padding:8px 12px;border-radius:99px;background:#fff;box-shadow:0 3px 14px #0001;font-weight:800}.grid{display:grid;grid-template-columns:1fr;gap:16px}.card{background:#fffffff0;border-radius:22px;padding:18px;box-shadow:0 10px 30px #76658b18}.card h2{margin:0 0 14px}.row{padding:12px 0;border-bottom:1px dashed #ded7e8}.row:last-child{border:0}.label{font-weight:900;margin-bottom:8px}.checks{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#f4effa;border-radius:12px;padding:9px 11px;font-weight:800}.imgs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.imgopt{position:relative;border:3px solid transparent;border-radius:13px;overflow:hidden;background:#fff;padding:0;cursor:pointer}.imgopt img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}.imgopt span{display:block;padding:5px;font-size:11px;font-weight:800;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.imgopt.on{border-color:#ff69a6;box-shadow:0 0 0 2px #ffd5e7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,select,input{font:inherit}button{border:0;border-radius:13px;padding:11px 15px;font-weight:900;cursor:pointer}.save{background:#ff72aa;color:#fff}.link{background:#806ce0;color:#fff}.ghost{background:#f1ecf7;color:#40374a}.small{font-size:13px;color:#796f80;line-height:1.55}.msg{min-height:20px;color:#17885d;font-weight:800;margin-top:8px}select{padding:10px 12px;border:1px solid #ddd2e4;border-radius:12px;background:#fff}@media(max-width:760px){.imgs{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="head"><div class="title">🧩 拼圖挑戰｜主控</div><div class="badge">小遊戲館共用設定</div></div><div class="grid"><div class="card"><h2>遊戲設定</h2><div class="small">遊戲開放、活動碼、玩家完成次數與得獎紀錄由小遊戲館主控統一管理。這裡只設定拼圖玩法。</div>
<div class="row"><div class="label">本場拼圖難度</div><div class="checks"><label class="chip"><input name="grid" value="4" type="radio"> 4×4（16片）</label><label class="chip"><input name="grid" value="5" type="radio"> 5×5（25片）</label><label class="chip"><input name="grid" value="6" type="radio"> 6×6（36片）</label></div><div class="small" style="margin-top:7px">玩家端不提供難度選擇，全部使用主控設定。</div></div>
<div class="row"><div class="label">開放圖片</div><div class="actions"><button id="all" class="ghost">全部開放</button><button id="none" class="ghost">全部取消</button></div><div id="imgs" class="imgs"></div></div>
<div class="row"><div class="label">遊戲時間（分鐘）</div><select id="time"><option value="0">不限時間</option><option value="1">1 分鐘</option><option value="2">2 分鐘</option><option value="3">3 分鐘</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option></select><div class="small" style="margin-top:7px">有限時：玩家顯示「剩餘時間」往下倒數；不限時間：從 00:00 往上計時。</div></div>
<div class="row"><div class="label">輔助功能</div><div class="checks"><label class="chip"><input id="peek" type="checkbox"> 👀 看原圖 3 秒</label><label class="chip">💡 提示 <select id="hints"><option>0</option><option>1</option><option>2</option><option>3</option><option>5</option></select> 次</label></div></div>
<div class="actions"><button id="save" class="save">💾 儲存設定</button><button id="player" class="link">📱 開啟玩家頁</button></div><div id="msg" class="msg"></div></div></div></div><script>
const images=[['貓咪＋花朵','https://images.openai.com/static-rsc-4/gz3FGkbJtM4pka_UOSbaOy4nxRtIxR8xkkp3zUpO_JTlpaK3lkOLWWFonx7EnsW79ymAXjuk-zzHiS0j7iRQONRuXjn9KRjR3iNwBZ-kFvjHz1Z3VK6RCJE1pYwOh5-lvYjCNvUKBsSES9i3gRfeIyZJ-XtJ5QCsKVChwNc5I_FWBnPaCfWtdCAgZZVmlCAd?purpose=fullsize'],['動物海邊','https://images.openai.com/static-rsc-4/pcNoSVzkqwXnrTYcLxwNdg3pNSVSp7GFMpe-_HPhJRDGUinnAS0lW1PtbGf_5muAx0NdBvmpDqFRBB9mr_Q70a52YFwbRpipKx54hHGBrvyGCU5kFlsDVIh_ampTpR1qOL7Ps235k80t2hHOkepNPrj7MKpFfZ8Vqq8xogUWAiNVERuJ1MgJVjPROpwk08eR?purpose=fullsize'],['可愛海底動物','https://images.openai.com/static-rsc-4/U3PonlmbxSA8WTSeNzPpyAT8mtXjAHCrruXoK1XoZOdMVwa0i0byI1mdX1lv72EfxaDhR5cSLxWaffOlGkEhXXcB4dTK5WEtVqno2Jk25x25AB4GFzQpuk-3bNP3lod-OAyB-e_ikSdopneVsUUxILe4SYD0CCHzz_aNdcDvEyiOnzJ-yBROn0MrFjX60CrI?purpose=fullsize'],['小狐狸＋彩虹魚','https://imgproxy.attic.sh/insecure/f%3Awebp/q%3A90/w%3A2048/plain/https%3A//attic.sh/9c15e27vqp7esjqwbp3zzbr7sqsa'],['可愛小鯨魚','https://images.openai.com/static-rsc-4/6nwmHll2M_M0-wzL1j3jBCZbEWFM5iouCOrGBQ5pYLzChJh8LILXFouyprn1228owEzb5SHibIPLOOeUYA-PvTNmtErle18c8p1MzbYbbypYrad4XFAKIsoC8lsYrr2VNF6HxDEU-F6AxxtbLzWcrULQCOZbl045B6WjPfaAZbfdDtkhEI5xIAC2cB6x-oyV?purpose=fullsize'],['海邊咖啡廳','https://images.openai.com/static-rsc-4/MhDromZo9aVK0--_zCSuacGeCE0udA8HMfWNrzdTZ2WlrHmC8_wG9KyW9gTCWWDP4Mb__7I6x3tcYo9NoyWeYfus7US2xD5bIECH8qsGG1xo9Z0At50rlXRgkRwkveoWvgT72_WnExAJaFgC1dT9IDZhDNdeosLf7nXekAxc94D8PCN-F4NTG0OCdbNxAvIo?purpose=fullsize'],['粉紅玩偶房間','https://images.openai.com/static-rsc-4/tqSBP60Tem6HSREsF4nFJHuaMlBVh_LNTTCz5FBwnwNGd-GkFhCyCECBe_ijngiUTFhLFF9CVpivOaVidPQDQUlEihISOMSthvbbJWUGGBlrSwpvijFX5N3QzJ88KDGc8XoCKXj_z579Zf1XaiN3FhpT8zvLS72ZGOeE4SdX9hLNLL3cj6jYx7at_-aXAMOS?purpose=fullsize'],['Q版女孩吃冰淇淋','https://images.openai.com/static-rsc-4/bMnWgCTjFf5aUOU9rd-a13IktBjyvlLIGGIk5R4xzq-QDNvMZNeJd0CXXtQkUN1k7hYPNxNyW5TLpHa_jTawpmClj2OGW35PI_DpxLSEkvh-akdl0e6oendDZD-8puzoZTAgbKX6XCb8Rp8Za8Bv53TIlVf1F0ZtyGGsE1k7oMkySCGYRvVT1W5wij8Tvzdq?purpose=fullsize'],['Baby Shark','https://m.media-amazon.com/images/S/pv-target-images/169742b045ee1d2c4faa48424bbe45d44797dbdf2f634efea4827594eafe3193._SX1080_FMpng_.png'],['海綿寶寶＋派大星','https://zefirka.club/uploads/posts/2022-09/1664376389_72-zefirka-club-p-oboi-na-telefon-gubka-bob-i-patrik-milie-75.jpg']];let settings=null,imageIds=[];const $=s=>document.querySelector(s);
function draw(){const box=$('#imgs');box.innerHTML='';images.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.className='imgopt'+(imageIds.includes(i)?' on':'');b.innerHTML=`<img src="${x[1]}" alt=""><span>${x[0]}</span>`;b.onclick=()=>{imageIds.includes(i)?imageIds=imageIds.filter(v=>v!==i):imageIds.push(i);draw()};box.appendChild(b)})}
async function load(){const r=await fetch('/api/game-settings/puzzle',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.message||'讀取失敗');settings=d.settings;document.querySelectorAll('input[name="grid"]').forEach(c=>c.checked=(+c.value===+settings.grid));imageIds=[...(settings.imageIds||[])];draw();$('#time').value=String(settings.timeMinutes??3);$('#peek').checked=!!settings.allowPeek;$('#hints').value=String(settings.hintCount??3)}
async function save(){const grid=+(document.querySelector('input[name="grid"]:checked')?.value||0);if(!grid)return alert('請選擇拼圖難度');if(!imageIds.length)return alert('至少開放一張圖片');const body={grid,imageIds,timeMinutes:+$('#time').value,allowPeek:$('#peek').checked,hintCount:+$('#hints').value};const r=await fetch('/api/game-settings/puzzle',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return alert(d.message||'儲存失敗');$('#msg').textContent='✅ 拼圖設定已儲存';setTimeout(()=>$('#msg').textContent='',1800);load()}
$('#save').onclick=save;$('#player').onclick=()=>window.open('/games/puzzle/player.html?activity='+encodeURIComponent(new URLSearchParams(location.search).get('activity')||''),'_blank');$('#all').onclick=()=>{imageIds=images.map((_,i)=>i);draw()};$('#none').onclick=()=>{imageIds=[];draw()};load().catch(e=>$('#msg').textContent='⚠️ '+e.message);
</script></body></html>
