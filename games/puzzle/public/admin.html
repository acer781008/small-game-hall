<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拼圖挑戰｜主控</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#fff4f8,#eef6ff);color:#40374a}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 28px #76658b18}.row{padding:12px 0;border-bottom:1px dashed #ded7e8}.label{font-weight:900;margin-bottom:8px}.checks{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:6px;background:#f4effa;border-radius:12px;padding:9px 11px;font-weight:800}input[type=checkbox],input[type=radio]{width:auto}.tier{padding:5px;border-radius:8px;border:1px solid #ddd;background:#fff}select{padding:9px 10px;border:1px solid #ddd2e4;border-radius:11px;background:#fff}button{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;background:#ff72aa;color:#fff}.small{font-size:13px;color:#796f80}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.msg{font-weight:900;color:#17885d;margin-top:8px}</style></head><body><div class="wrap"><div class="card"><h2>🧩 拼圖挑戰設定</h2><div class="small">37 張新拼圖已分成 6 類。玩家只選分類，按開始後系統才從該分類隨機抽 1 張。</div><div class="row"><label class="chip"><input id="selfSelect" type="checkbox"> 允許玩家自選分類與盤面</label></div><div class="row"><div class="label">主控指定盤面</div><select id="grid"><option value="4">4×4</option><option value="5">5×5</option><option value="6">6×6</option></select></div><div class="row"><div class="label">開放盤面＋C獎級別</div><div id="gridChecks" class="checks"></div></div><div class="row"><div class="label">主控指定分類</div><select id="category"></select></div><div class="row"><div class="label">開放分類</div><div id="catChecks" class="checks"></div></div><div class="row"><div class="label">遊戲時間（分鐘）</div><select id="time"><option value="0">不限時間</option><option>5</option><option>10</option><option selected>15</option><option>20</option><option>30</option><option>45</option><option>60</option></select></div><div class="row"><div class="label">輔助功能</div><div class="checks"><label class="chip"><input id="peek" type="checkbox"> 👀 看原圖 3 秒</label><label class="chip">💡 提示 <select id="hints"><option>0</option><option>1</option><option>2</option><option>3</option><option>5</option></select> 次</label></div></div><div class="actions"><button id="save">💾 儲存設定</button></div><div id="msg" class="msg"></div></div></div><script>
const cats=['可愛動物','海洋世界','森林／農場','樂園／甜點','冬季／極光','旅行／風景'];let s;async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}function draw(){category.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');category.value=s.category;catChecks.innerHTML=cats.map(c=>`<label class="chip"><input type="checkbox" data-cat="${c}" ${(s.allowedCategories||[]).includes(c)?'checked':''}> ${c}</label>`).join('');gridChecks.innerHTML=[4,5,6].map(g=>`<label class="chip"><input type="checkbox" data-grid="${g}" ${(s.allowedGrids||[]).includes(g)?'checked':''}> ${g}×${g}<select class="tier" data-tier="${g}"><option ${s.tierByGrid?.[g]==='C1'?'selected':''}>C1</option><option ${s.tierByGrid?.[g]==='C2'?'selected':''}>C2</option><option ${s.tierByGrid?.[g]==='C3'?'selected':''}>C3</option></select></label>`).join('')}async function load(){const d=await api('/api/game-settings/puzzle');s=d.settings;selfSelect.checked=!!s.selfSelect;grid.value=String(s.grid);time.value=String(s.timeMinutes);peek.checked=!!s.allowPeek;hints.value=String(s.hintCount);draw()}save.onclick=async()=>{try{const allowedGrids=[...document.querySelectorAll('[data-grid]:checked')].map(x=>+x.dataset.grid),allowedCategories=[...document.querySelectorAll('[data-cat]:checked')].map(x=>x.dataset.cat),tierByGrid={};[4,5,6].forEach(g=>tierByGrid[g]=document.querySelector(`[data-tier="${g}"]`).value);await api('/api/game-settings/puzzle',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({selfSelect:selfSelect.checked,grid:+grid.value,category:category.value,allowedGrids,allowedCategories,tierByGrid,timeMinutes:+time.value,allowPeek:peek.checked,hintCount:+hints.value})});msg.textContent='✅ 已儲存';load()}catch(e){msg.textContent=e.message}};load();
</script></body></html>
