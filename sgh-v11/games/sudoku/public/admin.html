<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>數獨設定</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#fff;color:#493e48}h2{margin:0 0 6px}p{color:#7d7079;margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-weight:800;display:block}select,input{width:100%;margin-top:6px;border:1px solid #d9ccd5;border-radius:11px;padding:10px;font:inherit;font-size:16px}button{border:0;border-radius:12px;padding:11px 16px;background:#7659d7;color:#fff;font:inherit;font-weight:900;cursor:pointer}.save{margin-top:16px}.msg{font-weight:900;margin-left:8px}.checks{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.checks input{width:auto;margin:0}@media(max-width:620px){.form{grid-template-columns:1fr}}</style></head><body><h2>🧠 數獨設定</h2><p>不再建立房號或活動；只保留數獨自己的規則。</p><div class="form"><label>玩法<select id="variant"><option>標準數獨</option><option>對角線數獨</option><option>殺手數獨</option><option>不連續數獨</option><option>不規則數獨</option><option>彩色數獨</option></select></label><label>盤面大小<select id="size"><option value="9">9 × 9</option><option value="12">12 × 12</option></select></label><label>難度<select id="difficulty"><option>初級</option><option>中級</option><option>高級</option></select></label><label>單局時間<select id="roundMinutes"><option value="3">3 分鐘</option><option value="5">5 分鐘</option><option value="10">10 分鐘</option><option value="15">15 分鐘</option><option value="20">20 分鐘</option><option value="30">30 分鐘</option><option value="45">45 分鐘</option><option value="60">60 分鐘</option></select></label><label class="full"><span class="checks"><input id="showWrongCount" type="checkbox"> 顯示錯誤格數</span></label></div><button class="save" id="save">💾 儲存數獨設定</button><span id="msg" class="msg"></span><script>
async function api(u,o){const r=await fetch(u,o),d=await r.json();if(r.status===401){top.location='/admin-login.html';throw 0}if(!r.ok)throw new Error(d.message||'操作失敗');return d}async function load(){const d=await api('/api/game-settings/sudoku'),s=d.settings;variant.value=s.variant;size.value=String(s.size);difficulty.value=s.difficulty;roundMinutes.value=String(s.roundMinutes);showWrongCount.checked=!!s.showWrongCount}save.onclick=async()=>{try{await api('/api/game-settings/sudoku',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({variant:variant.value,size:+size.value,difficulty:difficulty.value,roundMinutes:+roundMinutes.value,showWrongCount:showWrongCount.checked})});msg.textContent='✅ 已儲存'}catch(e){msg.textContent=e.message}};load();</script></body></html>
