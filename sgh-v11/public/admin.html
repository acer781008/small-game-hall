<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小遊戲館｜主控後台</title><link rel="stylesheet" href="/styles.css"></head><body class="cute-admin-page">
<header class="top cute-admin-top"><h1>🛠️ 小遊戲館｜主控後台</h1><div class="spacer"></div><a class="btn light" href="/">玩家首頁</a><button class="btn light" id="logout">登出</button></header>
<main class="wrap cute-admin-wrap">
<section class="admin-mini-hero" aria-label="主控後台歡迎區">
  <div class="admin-mini-hero-icons">⭐ 🎮 🎁 ✨</div>
  <div><strong>小遊戲館主控中心</strong><span>活動、遊戲、獎品一次管理</span><span id="storageBadge" class="storage-badge">💾 檢查資料保存...</span></div>
</section>
<section class="card activity-admin cute-activity-card"><div class="section-head"><div><h2>🎟️ 本場活動</h2><p class="muted">所有遊戲、獎品與得獎紀錄都共用這一個活動碼。</p></div><div class="activity-code-big" id="activityCode">------</div></div>
<div class="activity-actions"><button id="newActivity">＋ 產生新活動碼</button><button id="copyUrl" class="btn light">🔗 複製玩家網址</button><button id="copyShare" class="btn light">📋 複製分享文字</button></div>
<div class="schedule-grid">
<label class="schedule-field"><b>🟢 開賽日期＋時間</b><input id="startAt" type="datetime-local"><small>不設定＝立即可玩</small></label>
<label class="schedule-field"><b>🔴 結束日期＋時間</b><input id="endAt" type="datetime-local"><small>不設定＝不限制結束時間</small></label>
</div>
<div id="scheduleHint" class="schedule-hint">⏱️ 日期時間為選用，可只設定其中一項。</div>
<label class="common-note"><b>📝 共用備註</b><input id="activityNote" maxlength="500" placeholder="例如：完成指定條件即可隨機獲獎，獎品送完為止"></label><div class="save-row"><button id="saveActivity">💾 儲存活動設定</button><span id="activitySaved" class="muted"></span></div></section>

<div class="simple-tabs cute-admin-tabs"><button class="simple-tab active" data-tab="games">🎮 遊戲管理</button><button class="simple-tab" data-tab="prizes">🎁 獎品設定</button><button class="simple-tab" data-tab="records">📋 得獎紀錄</button></div>
<section class="simple-panel active" id="p-games"><div class="card cute-panel-card games-panel"><div class="section-head"><div><h2>🎮 遊戲管理</h2><p class="muted">只決定要不要開放；要改玩法再按「設定」。</p></div></div><div class="manage-grid" id="gameManage"></div><div id="hallSaved" class="save-inline hidden">✅ 已更新遊戲開放狀態</div></div><div class="card settings-box hidden cute-panel-card settings-panel" id="settingsBox"><div class="section-head"><h2 id="settingsTitle">遊戲設定</h2><button class="btn light" id="closeSettings">收起設定</button></div><iframe class="frame compact-frame" id="gameFrame" title="遊戲設定"></iframe></div></section>
<section class="simple-panel" id="p-prizes"><div class="card cute-panel-card prizes-panel"><div class="section-head"><div><h2>🎁 獎品設定</h2><p class="muted">本場活動專用獎池。玩家時間內完成後，系統會依剩餘數量隨機發一份。</p></div><button id="copyPrizes" class="btn light">📋 複製剩餘獎品</button></div><div class="setting-line"><label><b>每位玩家最多可得獎</b></label><select id="maxClaims"><option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option><option value="0">不限制</option></select><button id="saveMax">儲存</button></div><hr class="soft-line"><h3>新增獎品</h3><div class="join"><input id="newName" placeholder="獎品名稱"><input id="newQty" type="number" min="0" value="1" style="max-width:130px"><button id="addPrize">＋ 新增</button></div><div id="prizeList" style="margin-top:16px"></div></div></section>
<section class="simple-panel" id="p-records"><div class="card cute-panel-card records-panel"><div class="section-head"><div><h2>📋 得獎紀錄</h2><p class="muted">只記錄真的有得獎的玩家。</p></div><button id="copyRecords">複製得獎紀錄</button></div><div class="record-wrap"><table class="records"><thead><tr><th>玩家</th><th>完成遊戲</th><th>獲得獎品</th><th>得獎時間</th></tr></thead><tbody id="recordBody"><tr><td colspan="4">目前沒有得獎紀錄</td></tr></tbody></table></div></div></section>
</main>
<script>
const GAME_META={bingo:{icon:'🎱',name:'賓果',desc:'完成 Bingo 即可獲獎。',eyebrow:'連成一線・挑戰好運！',art:'/assets/bingo-art.webp',cls:'bingo-card'},sudoku:{icon:'🧠',name:'數獨',desc:'時間內完成整盤即可獲獎。',eyebrow:'動動腦・挑戰極限！',art:'/assets/sudoku-art.webp',cls:'sudoku-card'},memory:{icon:'🎴',name:'翻牌',desc:'時間內完成全部配對即可獲獎。',eyebrow:'翻開卡片・挑戰驚喜！',art:'/assets/memory-art.webp',cls:'memory-card'},shelf:{icon:'🛒',name:'貨架整理',desc:'時間內完成貨架整理即可獲獎。',eyebrow:'整理小物・療癒時光！',art:'/assets/shelf-art.webp',cls:'shelf-card'}};
let activity=null,records=[];const tabs=[...document.querySelectorAll('.simple-tab')],panels=[...document.querySelectorAll('.simple-panel')];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opt){const r=await fetch(url,opt);if(r.status===401){location.href='/admin-login.html';throw new Error('未登入')}const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||'操作失敗');return d}
function playerUrl(){return location.origin+'/?activity='+encodeURIComponent(activity.code)}
async function copyText(t){try{await navigator.clipboard.writeText(t);alert('✅ 已複製')}catch{prompt('請手動複製',t)}}
function toLocalInput(ms){if(!ms)return '';const d=new Date(ms),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function fromLocalInput(v){return v?new Date(v).getTime():null}
function fmtDate(ms){return ms?new Date(ms).toLocaleString('zh-TW',{hour12:false}):''}
async function loadActivity(){const d=await api('/api/activity');activity=d.activity;activityCode.textContent=activity.code;activityNote.value=activity.note||'';startAt.value=toLocalInput(activity.startAt);endAt.value=toLocalInput(activity.endAt);renderGames()}
function renderGames(){gameManage.innerHTML=Object.entries(GAME_META).map(([id,m])=>`<article class="cute-game-card admin-game-card ${m.cls}" data-admin-game="${id}"><div class="cute-art"><img src="${m.art}" alt="${m.name}插圖"></div><div class="cute-game-content admin-game-content"><div class="cute-eyebrow">${m.eyebrow}</div><h3>${m.name}</h3><p>${m.desc}</p><label class="admin-card-toggle"><input type="checkbox" data-toggle="${id}" ${activity.games?.[id]!==false?'checked':''}><span class="admin-game-state">● ${activity.games?.[id]!==false?'開放中':'已關閉'}</span></label><button class="game-setting-btn" data-game="${id}">⚙️ 遊戲設定</button></div><span class="deco deco-a">★</span><span class="deco deco-b">✦</span></article>`).join('');gameManage.querySelectorAll('[data-toggle]').forEach(x=>x.onchange=async()=>{const games={...activity.games,[x.dataset.toggle]:x.checked};const d=await api('/api/activity',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({games})});activity=d.activity;const state=x.closest('.admin-card-toggle').querySelector('.admin-game-state');state.textContent='● '+(x.checked?'開放中':'已關閉');state.classList.toggle('off',!x.checked);hallSaved.classList.remove('hidden');setTimeout(()=>hallSaved.classList.add('hidden'),1200)});gameManage.querySelectorAll('.game-setting-btn').forEach(b=>b.onclick=()=>{settingsTitle.textContent=GAME_META[b.dataset.game].icon+' '+GAME_META[b.dataset.game].name+'設定';settingsBox.classList.remove('hidden');gameFrame.src=`/games/${b.dataset.game}/admin.html?activity=${encodeURIComponent(activity.code)}`;settingsBox.scrollIntoView({behavior:'smooth',block:'start'})})}
newActivity.onclick=async()=>{if(!confirm('產生新活動碼後，會切換成一場全新的活動；新活動的獎品與得獎紀錄會重新開始。確定嗎？'))return;const d=await api('/api/activity/new',{method:'POST'});activity=d.activity;activityCode.textContent=activity.code;activityNote.value='';startAt.value='';endAt.value='';settingsBox.classList.add('hidden');renderGames();alert('✅ 新活動碼：'+activity.code)};
copyUrl.onclick=()=>copyText(playerUrl());copyShare.onclick=()=>{const open=Object.entries(GAME_META).filter(([id])=>activity.games?.[id]!==false).map(([,m])=>m.name).join('、')||'目前無開放遊戲';const timeText=`${activity.startAt?'開賽：'+fmtDate(activity.startAt)+'\n':''}${activity.endAt?'結束：'+fmtDate(activity.endAt)+'\n':''}`;copyText(`🎮 小遊戲館活動\n活動碼：${activity.code}\n開放遊戲：${open}\n${timeText}完成指定條件即可隨機獲獎，獎品送完為止\n${activity.note?'備註：'+activity.note+'\n':''}玩家網址：${playerUrl()}`)};
saveActivity.onclick=async()=>{const s=fromLocalInput(startAt.value),e=fromLocalInput(endAt.value);if(s&&e&&e<=s)return alert('❌ 結束時間必須晚於開賽時間');try{const d=await api('/api/activity',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({note:activityNote.value,startAt:s,endAt:e})});activity=d.activity;activitySaved.textContent='✅ 活動設定已儲存';setTimeout(()=>activitySaved.textContent='',1600)}catch(err){alert('❌ '+err.message)}};
function openTab(name){tabs.forEach(b=>b.classList.toggle('active',b.dataset.tab===name));panels.forEach(p=>p.classList.toggle('active',p.id==='p-'+name));if(name==='prizes')loadPrizes();if(name==='records')loadRecords()}tabs.forEach(b=>b.onclick=()=>openTab(b.dataset.tab));closeSettings.onclick=()=>settingsBox.classList.add('hidden');
async function loadPrizes(){const d=await api('/api/prizes');maxClaims.value=String(d.maxClaimsPerPlayer??1);prizeList.innerHTML=d.prizes.length?d.prizes.map(p=>`<div class="prize-row" data-id="${p.id}"><input class="pname" value="${esc(p.name)}"><input class="pqty" type="number" min="0" value="${p.quantity}"><label><input class="penabled" type="checkbox" ${p.enabled?'checked':''}> 啟用</label><button class="delete btn light">刪除</button></div>`).join(''):'<p class="muted">尚未新增獎品</p>';prizeList.querySelectorAll('.prize-row').forEach(row=>{const save=()=>api('/api/prizes/'+row.dataset.id,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({name:row.querySelector('.pname').value,quantity:+row.querySelector('.pqty').value,enabled:row.querySelector('.penabled').checked})});row.querySelector('.pname').onchange=save;row.querySelector('.pqty').onchange=save;row.querySelector('.penabled').onchange=save;row.querySelector('.delete').onclick=async()=>{if(confirm('刪除這個獎品？')){await api('/api/prizes/'+row.dataset.id,{method:'DELETE'});loadPrizes()}}})}
copyPrizes.onclick=async()=>{const d=await api('/api/prizes');const available=(d.prizes||[]).filter(p=>p.enabled!==false&&Number(p.quantity)>0);if(!available.length)return copyText(`🎁 剩餘獎品｜活動 ${activity.code}\n目前已無可發放獎品`);const total=available.reduce((sum,p)=>sum+Number(p.quantity||0),0);const lines=[`🎁 剩餘獎品｜活動 ${activity.code}`,...available.map(p=>`${p.name} × ${p.quantity}`),`總剩餘：${total} 份`];copyText(lines.join('\n'))};
addPrize.onclick=async()=>{const name=newName.value.trim();if(!name)return alert('請輸入獎品名稱');await api('/api/prizes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,quantity:+newQty.value})});newName.value='';loadPrizes()};saveMax.onclick=async()=>{await api('/api/prize-settings',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({maxClaimsPerPlayer:+maxClaims.value})});alert('✅ 已儲存')};
function fmt(t){return new Date(t).toLocaleString('zh-TW',{hour12:false})}function dateOnly(t){const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())}`}function timeOnly(t){const d=new Date(t),p=n=>String(n).padStart(2,'0');return `${p(d.getHours())}:${p(d.getMinutes())}`}function recordCopyText(list){const groups=new Map();for(const r of list){const day=dateOnly(r.awardedAt);if(!groups.has(day))groups.set(day,[]);groups.get(day).push(r)}const lines=[`📋 得獎紀錄｜共 ${list.length} 筆`,''];let n=1;for(const [day,rows] of groups){lines.push(`【${day}】`);for(const r of rows){lines.push(`${String(n++).padStart(2,'0')}. ${r.player}｜${r.game}｜${r.prize}｜${timeOnly(r.awardedAt)}`)}lines.push('')}return lines.join('\n').trim()}async function loadRecords(){const d=await api('/api/prize-records');records=d.records||[];recordBody.innerHTML=records.length?records.map(r=>`<tr><td>${esc(r.player)}</td><td>${esc(r.game)}</td><td>${esc(r.prize)}</td><td>${fmt(r.awardedAt)}</td></tr>`).join(''):'<tr><td colspan="4">目前沒有得獎紀錄</td></tr>'}copyRecords.onclick=()=>{if(!records.length)return alert('目前沒有得獎紀錄');copyText(recordCopyText(records))};
async function loadStorageStatus(){try{const d=await api('/api/storage-status');storageBadge.textContent=d.persistent?'💾 永久資料庫：已連線':'⚠️ 本機 JSON：正式上線前請設定 DATABASE_URL';storageBadge.classList.toggle('warn',!d.persistent)}catch{storageBadge.textContent='⚠️ 無法確認資料保存狀態';storageBadge.classList.add('warn')}}
logout.onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/admin-login.html'};loadStorageStatus();loadActivity();
</script></body></html>
